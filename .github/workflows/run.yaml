name: Run

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Dist
        uses: actions/checkout@v4
        with:
          path: dist
          ref: dist
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: run
      - name: Parse Commands
        run: cargo run --release --bin arma3-wiki-parse
        env:
          BI_WAF_SKIP: ${{ secrets.BI_WAF_SKIP }}
      - name: Update GitHub
        run: cargo run --release --bin arma3-wiki-github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-website:
    runs-on: ubuntu-latest
    needs: run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout Dist
        uses: actions/checkout@v4
        with:
          path: dist
          ref: dist

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build Angular application
        working-directory: website
        run: npm run build:prod

      - name: Build Rust metadata generator
        run: cargo build -p arma3-wiki-website --release

      - name: Generate metadata
        run: ./target/release/website

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist-website
          retention-days: 5

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist-website'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-website
          cname: wiki.hemtt.dev

      - name: Create summary
        run: |
          echo "## Website Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated files:" >> $GITHUB_STEP_SUMMARY
          find dist-website -type f -exec ls -lh {} \; | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Total size: $(du -sh dist-website | cut -f1)" >> $GITHUB_STEP_SUMMARY
