name: vectorCrossProduct
desc: "Cross product of two 3D vectors. \n<br>In layman's terms, if you have a polygon (surface) defined by 3 points, you can find a normal to it (just like terrain [[surfaceNormal]]). To invert direction of the normal, swap arguments around."
groups:
- Math - Vectors
syntax:
- call: !Binary
  - vector1
  - vector2
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: vector [x, y, z]
  left: !Item
    name: vector1
    desc: since Arma 3 v2.00, z coordinate is defaulted to 0 if not provided
    type: !OneOf
    - type: Vector3d
      desc: null
      since: null
    - type: Vector2d
      desc: null
      since: null
  right: !Item
    name: vector2
    desc: since Arma 3 v2.00, z coordinate is defaulted to 0 if not provided
    type: !OneOf
    - type: Vector3d
      desc: null
      since: null
    - type: Vector2d
      desc: null
      since: null
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.22'
examples:
- <sqf>_vector = [1,1,1] vectorCrossProduct [2,2,2];</sqf>
- <sqf>_vectorUp = [0,1,0] vectorCrossProduct [-1,0,0]; //[0,-0,1]</sqf>
- <sqf>_vectorSide = (vectorDir player) vectorCrossProduct (vectorUp player);</sqf>
see_also:
- vectorAdd
- vectorDiff
- vectorDotProduct
- vectorCos
- vectorMagnitude
- vectorMagnitudeSqr
- vectorMultiply
- vectorDistance
- vectorDistanceSqr
- vectorDir
- vectorUp
- setVectorDir
- setVectorUp
- setVectorDirAndUp
- vectorNormalized
- vectorFromTo
- matrixMultiply
- matrixTranspose
