name: setEngineRpmRTD
desc: Sets the RPM of given engines. {{Feature|afm}}
groups:
- RTD
syntax:
- call: !Binary
  - helicopter
  - - rpm
    - engineIndex
  ret:
    type: Nothing
  left: !Item
    name: helicopter
    type: Object
  right: !Array
  - !Item
    name: rpm
    desc: wanted RPM
    type: Number
  - !Item
    name: engineIndex
    desc: |-
      index of the engine
      * engine index 0: engine #1
      * engine index 1: engine #2
      * engine index 2: engine #3
      * engine index -1: all engines
    type: Number
argument_loc: Unspecified
effect_loc: Unspecified
since:
  tkoh: '1.00'
  arma3: '1.34'
examples:
- <sqf>myHelicopter setEngineRpmRTD [1337, -1];</sqf>
see_also:
- setWantedRPMRTD
- rotorsRpmRTD
- enginesRpmRTD
