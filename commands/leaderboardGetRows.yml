name: leaderboardGetRows
desc: Returns values for the given leaderboard; this can be called after the one of the row request function has been called and successfully finished!
groups:
- Leaderboards
syntax:
- call: !Unary boardName
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: 'format: [[player1Name, score, rank], [player2Name, score, rank], [player3Name, score, rank] ...]'
  right: !Item
    name: boardName
    type: String
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.56'
examples:
- <sqf>leaderboardGetRows "TT01";</sqf>
see_also:
- leaderboardDeInit
- leaderboardInit
- leaderboardRequestRowsFriends
- leaderboardRequestRowsGlobal
- leaderboardRequestRowsGlobalAroundUser
- leaderboardsRequestUploadScore
- leaderboardsRequestUploadScoreKeepBest
- leaderboardState
