name: markerPolyline
desc: Returns a polyline marker's path data.
groups:
- Markers
syntax:
- call: !Unary marker
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: format {{hl|[x1, y1, x2, y2, ... xn, yn]}}
  right: !Item
    name: marker
    type: String
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '2.02'
examples:
- '<sqf>markerPolyline "_USER_DEFINED #0/0/1"; // returns your first polyline''s data in Singleplayer</sqf>'
see_also:
- setMarkerPolyline
- setMarkerPolylineLocal
