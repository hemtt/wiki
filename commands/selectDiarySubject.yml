name: selectDiarySubject
desc: Selects a subject page in the [[Diary|diary]]. The subject page is selected but the command does not open the map by default, which could be opened with [[openMap]] if necessary.
groups:
- Briefing
syntax:
- call: !Binary
  - player
  - subject
  ret:
    type: Boolean
    desc: '[[true]] if subject was successfully selected'
  left: !Item
    name: player
    desc: player
    type: Object
  right: !Item
    name: subject
    desc: subject name, for example "Diary" (see also [[Diary]]).
    type: String
argument_loc: Local
effect_loc: Local
since:
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- |-
  <sqf>
  openMap true;
  player selectDiarySubject "Diary";
  </sqf>
see_also:
- processDiaryLink
- createDiaryLink
- createDiarySubject
- diarySubjectExists
- allDiarySubjects
