name: setBehaviour
desc: |-
  Sets individual unit behaviour '''on every unit in a group'''.
  {{Feature|important|This command doesn't set AI [[Group]] behaviour, see [[setCombatBehaviour]] or [[setBehaviourStrong]] for this.}}
  {{Feature|informative|See [[AI Behaviour]] for details of the effect of this command on AI units.}}
  <spoiler text="Comparison of Behaviour commands">
  {| class="wikitable" style="text-align: center"
  ! Command
  ! Applies To
groups:
- Groups
- AI Behaviour
syntax:
- call: !Binary
  - groupOrUnit
  - behaviour
  ret:
    type: Nothing
  left: !Item
    name: groupOrUnit
    desc: unit or a [[group]]
    type: !OneOf
    - type: Group
      desc: null
      since: null
    - type: Object
      desc: null
      since: null
  right: !Item
    name: behaviour
    desc: |-
      can be one of:
      * "CARELESS"
      * "SAFE"
      * "AWARE"
      * "COMBAT"
      * "STEALTH"
    type: String
argument_loc: Local
effect_loc: Global
since:
  ofp: '1.00'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_group1 setBehaviour "SAFE";</sqf>
see_also:
- setCombatBehaviour
- combatBehaviour
- AIBehaviour
- behaviour
- setBehaviourStrong
- setWaypointBehaviour
- combatMode
- setCombatMode
- skill
- setSkill
- Arma
- '3:'
- AI
- Skill
