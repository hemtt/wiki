name: setHit
desc: "{{{!}} class=\"wikitable float-right align-center-col-2\"\n{{!}}+ \n! {{Link|Category: Event Handlers|Event Handler}}\n! Triggered\n{{!}}-\n{{!}} {{hl|Hit}}\n{{!}} {{Icon|unchecked}}\n{{!}}-\n{{!}} {{hl|HandleDamage}}\n{{!}} {{Icon|unchecked}}\n{{!}}-\n{{!}} {{hl|Killed}}\n{{!}} {{Icon|checked}}\n{{!}}-\n{{!}} {{hl|MPKilled}}\n{{!}} {{Icon|checked}}\n{{!}}}\n\nSet damage on a part of an object.\n{{Feature|informative|Some part names are in Czech; see the [[ArmA: Armed Assault: Selection Translations|translation table]].}}"
groups:
- Object Manipulation
syntax:
- call: !Binary
  - object
  - - part
    - damage
    - useEffects
    - killer
    - instigator
    - breakRotor
  ret:
    type: Nothing
  left: !Item
    name: object
    desc: '[[local]] object'
    type: Object
  right: !Array
  - !Item
    name: part
    desc: name of the part ([[Named_Selection|selection]] name)
    type: String
  - !Item
    name: damage
    desc: damage value ranging 0..1, 0 being fully functional, 1 being destroyed
    type: Number
  - !Item
    name: useEffects
    desc: '[[false]] to skip destruction effects'
    type: Boolean
    optional: true
    default: 'true'
    since:
      arma3: '1.68'
  - !Item
    name: killer
    desc: |-
      the entity that caused the damage. If the damage leads to the death of the unit, the killer will be used as the object that caused the kill.
      * it can be used to show "killed by player" in debriefing statistics and kill messages in the chat (if death messages are enabled).
      * it will alter the killer's [[rating]] as if the killer directly killed the unit.
      * it will be listed as <sqf inline>_killer</sqf> parameter in the [[Arma 3: Event Handlers#Killed|Killed]] event handler.
    type: Object
    optional: true
    default: objnull
    since:
      arma3: '2.08'
  - !Item
    name: instigator
    desc: |-
      the person that instigated the damage.
      * if a tank is a killer, the tank gunner that pulled the trigger is instigator
      * it will be listed as <sqf inline>_instigator</sqf> parameter in the [[Arma 3: Event Handlers#Killed|Killed]] event handler.
    type: Object
    optional: true
    default: objnull
    since:
      arma3: '2.12'
  - !Item
    name: breakRotor
    desc: if the hitpoint is rotor on a helicopter, [[true]] will break the rotor as well as play corresponding sound if 'useEffects' is also [[true]].
    type: Boolean
    optional: true
    default: 'false'
    since:
      arma3: '2.18'
argument_loc: Local
effect_loc: Global
since:
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>vehicle player setHit ["motor", 1];</sqf>
- <sqf>vehicle player setHit ["mala vrtule", 0.95];</sqf>
- "<sqf>\nif (local _heli) then\n{\n\t_heli setHit [\"velka vrtule\", 0];\n}\nelse\n{\n\thint (\"Vehicle \" + str _heli + \" must be local to this machine to do that!\");\n};\n</sqf>"
see_also:
- getHit
- getHitPointDamage
- setHitPointDamage
- damage
- setDamage
- setFuel
- setAmmo
- getHitIndex
- setHitIndex
- forceHitPointsDamageSync
