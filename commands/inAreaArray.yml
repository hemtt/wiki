name: inAreaArray
desc: |-
  Returns given list of [[Object]]s and/or [[Position]]s that are in the given area, area defined by a trigger, marker, location or array.

  {{Feature|important| By default all positions given as [[Array]] or as objects are treated as [[PositionAGL]]. Since {{GVI|arma3|2.20|size= 0.75}} there is an option to force them to [[PositionWorld]] format.}}
groups:
- Triggers
- Markers
- Locations
- Positions
syntax:
- call: !Binary
  - positions
  - area
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: of [[Object]]s and/or [[Position]]s
  left: !Item
    name: positions
    desc: of [[Object]]s and/or [[Position]]s
    type: !Unknown 'Unknown simple type: array'
  right: !Item
    name: area
    desc: |-
      trigger
      location
      marker name
    type: !OneOf
    - type: Object
      desc: trigger
      since: null
    - type: Location
      desc: location
      since: null
    - type: String
      desc: marker name
      since: null
- call: !Binary
  - positions
  - - centre
    - a
    - b
    - angle
    - isRectangle
    - c
    - usePosWorld
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: of [[Object]]s and/or [[Position]]s
  left: !Item
    name: positions
    desc: Places to check. [[Position]]s must be [[Position#PositionAGL|PositionAGL]] if area is checked in 3D (see note in description)
    type: !Unknown Exceeded maximum recursion depth while parsing Value
  right: !Array
  - !Item
    name: centre
    desc: ', [[Position#PositionAGL|PositionAGL]], {{GVI|arma3|2.14|size= 0.75}} [[Object]] or [[Group]]'
    type: Position2d
  - !Item
    name: a
    desc: x axis (x / 2)
    type: Number
  - !Item
    name: b
    desc: y axis (y / 2)
    type: Number
  - !Item
    name: angle
    desc: rotation angle
    type: Number
    optional: true
    default: '0'
  - !Item
    name: isRectangle
    desc: '[[true]] if rectangle, [[false]] if ellipse'
    type: Boolean
    optional: true
    default: 'false'
  - !Item
    name: c
    desc: z axis (z / 2)
    type: Number
    optional: true
    default: '-1: unlimited'
  - !Item
    name: usePosWorld
    desc: set to [[true]] to treat all positions as [[PositionWorld]]
    type: Boolean
    optional: true
    default: 'false'
    since:
      arma3: '2.20'
- call: !Binary
  - positions
  - - posN
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: of [[Object]]s and/or [[Position]]s
  left: !Item
    name: positions
    desc: places to check.
    type: !Unknown Exceeded maximum recursion depth while parsing Value
  right: !Array
  - !Infinite
    - !Item
      name: posN
      desc: polygon vertices in 2d or 3d format (see [[inPolygon]])
      type: Position
  since:
    arma3: '2.20'
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.66'
examples:
- <sqf>vehicles inAreaArray myTrigger;</sqf>
- <sqf>allUnits inAreaArray "myMarker";</sqf>
- <sqf>allPlayers inAreaArray myLocation;</sqf>
- <sqf>allDead inAreaArray [[100, 100, 0], 20, 30, 45, false, 10];</sqf>
see_also:
- inAreaArrayIndexes
- inArea
- triggerArea
