name: getMousePosition
desc: Returns mouse position in UI coordinates.
groups:
- GUI Control - Positioning
syntax:
- call: Nular
  ret:
    type: Position2d
    desc: x and y UI coordinates of the mouse position
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.54'
examples:
- <sqf>getMousePosition params ["_mouseX", "_mouseY"];</sqf>
see_also:
- setMousePosition
- ctrlSetMousePosition
- ctrlMousePosition
- ctrlMapCursor
- reversedMouseY
