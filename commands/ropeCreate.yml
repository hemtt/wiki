name: ropeCreate
desc: |-
  Creates a PhysX rope with given params. Since Arma 3 v2.14 the optional arguments can be skipped by setting them to [[nil]].
  {{Feature | Informative |
  * ''fromObject'' has to be [[ropeCreate/transport | transport]] vehicle, [[alive]] with [[enableRopeAttach | rope attachment]] enabled, ''toObject'' has to be an entity, alive with [[enableRopeAttach | rope attachment]] enabled.
  * {{hl|ropeEndType}} is defined in config under {{hl|"CfgNonAIVehicles" >> "RopeEnd"}}; see [[Arma 3: Ropes]]. Currently this is a hook that will be created on the end of the rope, and {{hl|ropeEndDownVector}} is its orientation, [0,0,-1] for example. The {{hl|"RopeEnd"}} is only shown when the rope is created object to object, it does not show on the open ended rope for some reason. There is currently no {{hl|"RopeStart"}}.
  * The rope creation is limited to 63 segments.}}
groups:
- Ropes and Sling Loading
syntax:
- call: !Unary
  - fromObject
  - fromPoint
  - toObject
  - toPoint
  - length
  - ropeStart
  - ropeEnd
  - ropeType
  - nSegments
  ret:
    type: Object
    desc: created rope or [[objNull]] on failure
  right: !Array
  - !Item
    name: fromObject
    desc: '[[ropeCreate/transport | transport]] where the rope originates and which fly behavior will be affected'
    type: Object
  - !Item
    name: fromPoint
    desc: position for the rope start, either a memory point [[String]] or relative offset [[Array]]
    type: !Unknown 'Unknown simple type: array'
  - !Item
    name: toObject
    desc: entity which is automatically [[ropeAttachTo | attached to]] the end of the rope
    type: Object
  - !Item
    name: toPoint
    desc: position for the rope end, either a memory point [[String]] or relative offset [[Array]]
    type: !Unknown 'Unknown simple type: array'
  - !Item
    name: length
    desc: rope length in meters
    type: Number
    optional: true
    default: '-1'
  - !Item
    name: ropeStart
    desc: ''
    type: !ArraySized
    - name: ropeStartType
      type: String
      default: null
      desc: type of the rope start (see description)
      since: null
    - name: ropeStartDownVector
      type: String
      default: null
      desc: or [[Array]], either a memory point [[String]] or relative vector [[Array]]. If [[String]] is given, then {{hl|ropeStartDownVector}} is calculated from {{hl|fromPoint}} towards {{hl|ropeStartDownVector}} memory point
      since: null
    optional: true
    default: '["", [0,0,-1'
  - !Item
    name: ropeEnd
    desc: ':'
    type: !ArraySized
    - name: ropeEndType
      type: String
      default: null
      desc: type of the rope end (see description)
      since: null
    - name: ropeEndDownVector
      type: String
      default: null
      desc: or [[Array]], either a memory point [[String]] or relative vector [[Array]]. If [[String]] is given, then {{hl|ropeEndDownVector}} is calculated from {{hl|toPoint}} towards {{hl|ropeEndDownVector}} memory point
      since: null
    optional: true
    default: '["", [0,0,-1'
  - !Item
    name: ropeType
    desc: '- rope type, {{hl|CfgVehicles}}'' classname'
    type: String
    optional: true
    default: '"rope"'
    since:
      arma3: '2.06'
  - !Item
    name: nSegments
    desc: '- number of rope segments (max 63)'
    type: Number
    optional: true
    default: '-1'
    since:
      arma3: '2.14'
- call: !Unary
  - fromObject
  - fromPoint
  - length
  - ropeStart
  - ropeEnd
  - ropeType
  - nSegments
  ret:
    type: Object
    desc: created rope or [[objNull]] on failure
  right: !Array
  - !Item
    name: fromObject
    desc: '[[ropeCreate/transport | transport]] where the rope originates and which fly behavior will be affected'
    type: Object
  - !Item
    name: fromPoint
    desc: position for the rope start, either a memory point [[String]] or relative offset [[Array]]
    type: !Unknown 'Unknown simple type: array'
  - !Item
    name: length
    desc: rope length in meters
    type: Number
  - !Item
    name: ropeStart
    desc: ''
    type: !ArraySized
    - name: ropeStartType
      type: String
      default: null
      desc: type of the rope start (see description)
      since: null
    - name: ropeStartDownVector
      type: String
      default: null
      desc: or [[Array]], either a memory point [[String]] or relative vector [[Array]]. If [[String]] is given, then {{hl|ropeStartDownVector}} is calculated from {{hl|fromPoint}} towards {{hl|ropeStartDownVector}} memory point
      since: null
    optional: true
    default: '["", [0,0,-1'
  - !Item
    name: ropeEnd
    desc: ''
    type: !ArraySized
    - name: ropeEndType
      type: String
      default: null
      desc: type of the rope end (see description)
      since: null
    - name: ropeEndDownVector
      type: !Unknown 'Unknown simple type: array'
      default: null
      desc: relative vector
      since: null
    optional: true
    default: '["", [0,0,-1'
  - !Item
    name: ropeType
    desc: '- rope type, {{hl|CfgVehicles}}'' classname'
    type: String
    optional: true
    default: '"rope"'
    since:
      arma3: '2.06'
  - !Item
    name: nSegments
    desc: '- number of rope segments (max 63)'
    type: Number
    optional: true
    default: '-1'
    since:
      arma3: '2.14'
argument_loc: Unspecified
effect_loc: Global
since:
  arma3: '1.34'
examples:
- <sqf>myRope = ropeCreate [vehicle player, "slingload0", myCargo, [0, 0, 0], 10];</sqf>
- <sqf>myRope = ropeCreate [veh1, [0, 0, -2], veh2, [0, 0, 0], 10];</sqf>
- |-
  Free end rope (Alt Syntax):
  <sqf>myRope = ropeCreate [vehicle player, [0, 0, 0], 10];</sqf>
- |-
  A rope with a hook on the end:
  <sqf>myRope = ropeCreate [heli, "slingload0", player, [0, 0, 2], 20, [], ["RopeEnd", [0, 0, -1]]];</sqf>
- |-
  Since 2.14:
  <sqf>myRope = ropeCreate [vehicle player, [0, 0, 0], 10, nil, nil, nil, 50];</sqf>
see_also:
- Arma
- '3:'
- Ropes
- ropeDestroy
- ropeDetach
- ropes
- ropeSegments
