name: setRadioMsg
desc: Sets radio trigger menu title text (0 -> 0 -> map radio). Use "NULL" to disable radio slot. Use "" to restore default title
groups:
- Triggers
- Interaction
syntax:
- call: !Binary
  - index
  - text
  ret:
    type: Nothing
  left: !Item
    name: index
    desc: from 1 to 10
    type: !NumberEnum
    - value: 1
      desc: Alpha (key 1)
      since: null
    - value: 2
      desc: Bravo (key 2)
      since: null
    - value: 3
      desc: Charlie (key 3)
      since: null
    - value: 4
      desc: Delta (key 4)
      since: null
    - value: 5
      desc: Echo (key 5)
      since: null
    - value: 6
      desc: Foxtrot (key 6)
      since: null
    - value: 7
      desc: Golf (key 7)
      since: null
    - value: 8
      desc: Hotel (key 8)
      since: null
    - value: 9
      desc: India (key 9)
      since: null
    - value: 10
      desc: Juliet (key 0)
      since: null
  right: !Item
    name: text
    type: String
argument_loc: Unspecified
effect_loc: Local
since:
  ofp: '1.00'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>1 setRadioMsg "Click meeeeeeeeee"; //changes title of radio Alpha</sqf>
see_also:
- createTrigger
- setTriggerActivation
- setTriggerText
- showCommandingMenu
