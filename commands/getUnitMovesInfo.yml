name: getUnitMovesInfo
desc: |-
  Returns various information about the unit moves (primary animation) and gestures (masked animation)
  {{Feature|informative| Up until {{GVI|arma3|2.20}} this command only worked for a man unit, and other units such as animals couldn't use this command. As of {{GVI|arma3|2.22}} animals are supported as well. }}
groups:
- Animations
syntax:
- call: !Unary unit
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: |-
      format:
      * 0 - moveProgress: [[Number]] - move progress in range 0-1
      * 1 - moveTime: [[Number]] - move elapsed time ({{hl|move progress * move duration}})
      * 2 - moveDuration: [[Number]] - move duration in seconds
      * 3 - moveFactor: [[Number]] - move blend factor
      * 4 - rtmStep: [[Vector3D]] - rtm step (how many meters the unit will move after finishing the animation)
      * 5 - gestureProgress: [[Number]] - gesture progress in range 0-1
      * 6 - gestureTime: [[Number]] - gesture elapsed time ({{hl|gesture progress * gesture duration}})
      * 7 - gestureDuration: [[Number]] - gesture duration in seconds
      * 8 - gestureFactor: [[Number]] - gesture blend factor
  right: !Item
    name: unit
    type: Object
- call: !Binary
  - unit
  - index
  ret:
    type: Anything
    desc: Value of the requested property, or [[Nothing]] if index is invalid. See the main syntax.
  left: !Item
    name: unit
    type: Object
  right: !Item
    name: index
    desc: index of property from the main syntax
    type: Number
argument_loc: Global
effect_loc: Unspecified
since:
  arma3: '2.18'
examples:
- "<sqf>\n// Getting the move velocity of the animation\nprivate _animInfo = getUnitMovesInfo player;\n// velocity = displacement / time\nprivate _animVelocity = _animInfo # 4 vectorMultiply -1 / _animInfo # 2;\t// -1 is because man model is reversed\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t// so the rtm animation moves \"backwards\"\n</sqf>"
- "<sqf>\ngetUnitMovesInfo player params [\n\t\"_moveProgress\",\n\t\"_moveTime\",\n\t\"_moveDuration\",\n\t\"_moveFactor\",\n\t\"_rtmStep\",\n\t\"_gestureProgress\",\n\t\"_gestureTime\",\n\t\"_gestureDuration\",\n\t\"_gestureFactor\"\n];\n</sqf>"
see_also:
- switchMove
- switchGesture
- moveTime
- gestureState
- animationState
