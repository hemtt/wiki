name: setTerrainGrid
desc: Sets the desired [[getTerrainGrid | terrain resolution]] in meters.
groups:
- System
- Environment
syntax:
- call: !Unary grid
  ret:
    type: Nothing
  right: !Item
    name: grid
    desc: for default landscapes the supported resolutions are
    type: !NumberEnum
    - value: 50
      desc: smoothest, less lag
      since: null
    - value: 25
      desc: default in multiplayer
      since: null
argument_loc: Unspecified
effect_loc: Local
since:
  ofp: '1.75'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>setTerrainGrid 12.5;</sqf>
see_also:
- getTerrainGrid
- setViewDistance
- viewDistance
- setDetailMapBlendPars
- getObjectViewDistance
- setObjectViewDistance
