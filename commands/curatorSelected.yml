name: curatorSelected
desc: Returns list of all curator selected items.
groups:
- Curator
syntax:
- call: Nular
  ret:
    type: !ArraySized
    - name: objects
      type: !Unknown 'Unknown simple type: array'
      default: null
      desc: of [[Object]]s
      since: null
    - name: groups
      type: !Unknown 'Unknown simple type: array'
      default: null
      desc: of [[Group]]s
      since: null
    - name: waypoints
      type: Waypoint
      default: null
      desc: null
      since: null
    - name: markers
      type: !Unknown 'Unknown simple type: array'
      default: null
      desc: of [[String]]s
      since: null
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.16'
examples:
- <sqf>_selectedItems = curatorSelected;</sqf>
- <sqf>curatorSelected params ["_selObjects", "_selGroups", "_selWaypoints", "_selMarkers"];</sqf>
see_also:
- curatorMouseOver
- setCuratorSelected
- addCuratorSelected
- Arma
- '3:'
- Curator
