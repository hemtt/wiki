name: assignedVehicleRole
desc: |-
  Returns the role a unit is assigned to within its assigned vehicle.
  {{Feature|informative|See [[AI Group Vehicle Management]] for more information.}}
multiplayer_note: On a client the command will return empty arrays for every unit that is not local. On the server the command correctly returns the role, regardless of the units locality.
groups:
- Object Manipulation
syntax:
- call: !Unary unitName
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: |-
      the array which is returned contains:<br>
      * [] - not assigned to any vehicle
      * ["driver"] - Assigned as driver
      * ["cargo"] or {{GVI|arma3|1.32|size= 0.75}} ["cargo", [turret path]] - assigned as cargo
      * ["turret", turretPath] - assigned to a turret (turretPath format [[Turret Path]])
  right: !Item
    name: unitName
    type: Object
argument_loc: Global
effect_loc: Unspecified
since:
  arma1: '1.05'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_RoleArray = assignedVehicleRole player;</sqf>
- |-
  Get weapons available to player at player occupied turret:
  <sqf>_weaponsTurret = vehicle player weaponsTurret (assignedVehicleRole player select 1);</sqf>
see_also:
- addVehicle
- assignedVehicle
- unassignVehicle
- leaveVehicle
- assignAsCargo
- assignAsCommander
- assignAsDriver
- assignAsGunner
- assignAsTurret
- crew
- assignedVehicles
- assignedGroup
- fullCrew
