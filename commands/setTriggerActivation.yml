name: setTriggerActivation
desc: |-
  Defines the trigger activation type.

  See [[ArmA:_Mission_Editor#Triggers_Mode_.28F3.29|ArmA:Mission Editor - Triggers]] for a thorough overview of triggers and its fields for activation, effects, etc.
multiplayer_note: Activation changes are local.
groups:
- Triggers
syntax:
- call: !Binary
  - trigger
  - - by
    - type
    - repeating
  ret:
    type: Nothing
  left: !Item
    name: trigger
    desc: trigger object
    type: Object
  right: !Array
  - !Item
    name: by
    desc: |-
      who activates trigger. Can be {{hl|"NONE"}}, or:
      * {{hl|"EAST"}}
      * {{hl|"WEST"}}
      * {{hl|"GUER"}}
      * {{hl|"CIV"}}
      * {{hl|"LOGIC"}}
      * {{hl|"ANY"}}
      * {{GVI|arma3|1.68|size= 0.75}} {{hl|"ANYPLAYER"}}
      * {{hl|"ALPHA"}}
      * {{hl|"BRAVO"}}
      * {{hl|"CHARLIE"}}
      * {{hl|"DELTA"}}
      * {{hl|"ECHO"}}
      * {{hl|"FOXTROT"}}
      * {{hl|"GOLF"}}
      * {{hl|"HOTEL"}}
      * {{hl|"INDIA"}}
      * {{hl|"JULIET"}}
      * {{hl|"STATIC"}}
      * {{hl|"VEHICLE"}}
      * {{hl|"GROUP"}}
      * {{hl|"LEADER"}}
      * {{hl|"MEMBER"}}
      * {{hl|"WEST SEIZED"}}
      * {{hl|"EAST SEIZED"}}
      * {{hl|"GUER SEIZED"}}
    type: String
  - !Item
    name: type
    desc: |-
      how trigger is it activated. Can be:
      * {{hl|"PRESENT"}}
      * {{hl|"NOT PRESENT"}}
      * {{hl|"WEST D"}}
      * {{hl|"EAST D"}}
      * {{hl|"GUER D"}}
      * {{hl|"CIV D"}}
    type: String
  - !Item
    name: repeating
    desc: activation can happen repeatedly
    type: Boolean
argument_loc: Global
effect_loc: Local
since:
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_trigger setTriggerActivation ["WEST", "EAST D", true];</sqf>
see_also:
- triggerActivation
- triggerActivated
- createTrigger
- setTriggerArea
- setTriggerStatements
- setTriggerText
- setTriggerTimeout
- setTriggerType
- triggerAttachVehicle
- triggerAttachObject
- triggerInterval
- setTriggerInterval
- enableSimulation
- simulationEnabled
