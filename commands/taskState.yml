name: taskState
desc: Returns the current state of a task.
groups:
- Briefing
syntax:
- call: !Unary task
  ret:
    type: !StringEnum
    - value: None
      desc: null
      since: null
    - value: Created
      desc: null
      since: null
    - value: Assigned
      desc: null
      since: null
    - value: Succeeded
      desc: null
      since: null
    - value: Failed
      desc: null
      since: null
    - value: Canceled
      desc: null
      since: null
    desc: current state of task -
  right: !Item
    name: task
    desc: the task you want to query
    type: Task
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- |-
  <sqf>
  tskSomeTask = player createSimpleTask ["NewTask"];
  hint format["Taskstate: %1", taskState tskSomeTask];
  </sqf>
see_also:
- Tasks
- createSimpleTask
- removeSimpleTask
- setSimpleTaskDescription
- setSimpleTaskDestination
- setTaskResult
- setTaskState
