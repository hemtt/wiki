name: sliderSpeed
desc: Returns slider step value for line and page movement of [[CT_SLIDER]] or [[CT_XSLIDER]].
groups:
- GUI Control
syntax:
- call: !Unary idc
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: format [minSpeed, maxSpeed, {{GVI|arma3|2.08|size= 0.75}} step]
  right: !Item
    name: idc
    desc: ': idc of the control'
    type: Number
- call: !Unary control
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: format [minSpeed, maxSpeed, {{GVI|arma3|2.08|size= 0.75}} step]
  right: !Item
    name: control
    type: Control
argument_loc: Unspecified
effect_loc: Unspecified
since:
  ofp: '1.85'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>sliderSpeed _ctrlSlider params ["_min", "_max", "_step"];</sqf>
see_also:
- sliderPosition
- sliderRange
- sliderSetPosition
- sliderSetRange
- sliderSetSpeed
