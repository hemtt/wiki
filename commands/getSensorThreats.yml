name: getSensorThreats
desc: Returns vehicle sensors' threats.
groups:
- Sensors
syntax:
- call: !Unary vehicle
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: |-
      format [[object, type, sensor], ...]:
      * object: [[Object]]
      * type: [[String]] - can be one of:
      ** "missile"
      ** "marked"
      ** "locked"
      * sensors: [[Array]] of [[String]]s - values can be:
      ** "ir"
      ** "laser"
      ** "missile"
      ** "radar" (not "activeradar"/"passiveradar")
      ** "visual"
  right: !Item
    name: vehicle
    desc: the sensors-equipped vehicle
    type: Object
argument_loc: Local
effect_loc: Unspecified
since:
  arma3: '2.06'
examples:
- "<sqf>\nprivate _dangers = getSensorThreats vehicle player;\n/*\n\treturns e.g\n\t[\n\t\t[164230: titan_missile_atl_fly.p3d, \"missile\", [\"visual\"]],\n\t\t[164233: titan_missile_atl_fly.p3d, \"threatmissile\", [\"radar\"]]\n\t]\n*/\n</sqf>"
see_also:
- getSensorTargets
- listVehicleSensors
- listRemoteTargets
