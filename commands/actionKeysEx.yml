name: actionKeysEx
desc: |-
  Gives a broken down version of [[actionKeys]] return. Returns an [[Array]] containing the breakdowns of the [[DIK_KeyCodes|dikCodes]] of keys, buttons and combos assigned to the given user action.<br>
  Action names can be found in config class ControllerSchemes or [[:Category:Key Actions|user action names]] or user profile (see {{Link|#Example 1}}).<br>
  In addition, some of the actions are also listed here: [[inputAction/actions]]

  The Key Device can be one of several types:
  {{Columns|3|
  * {{hl|"KEYBOARD"}}
  * {{hl|"MOUSE_BUTTON"}}
  * {{hl|"MOUSE_AXIS"}}
  * {{hl|"JOYSTICK_BUTTON"}}
  * {{hl|"JOYSTICK_AXIS"}}
  * {{hl|"JOYSTICK_POV"}}
  * {{hl|"XINPUT"}} - (Xbox) Controller Input
  * {{hl|"TRACKER"}} - Motion Tracking (TrackIR, Tobii etc)
  }}
groups:
- Interaction
syntax:
- call: !Unary userAction
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: |-
      of [[Array]]s in format [mainKeyArray, comboKeyArray, isDoubleTap]:
      * mainKeyArray: [[Array]] with [dikCode, device, deviceId]
      ** dikCode: [[Number]]
      ** device: [[String]]
      ** deviceId: [[Number]] - only given if the device is a Joystick type
      * comboKeyArray: [[Array]] identical to ''mainKeyArray'' - filled only if the action key is a key combination
      ** dikCode: [[Number]]
      ** device: [[String]]
      ** deviceId: [[Number]] - identical to ''mainKeyArrays ''deviceId'' as it is impossible to use two different Joystick devices in a key combination
      * isDoubleTap: [[Boolean]] - is the action key a double-tap. In case of a combination key this applies to the main key.
  right: !Item
    name: userAction
    desc: user action name (see [[inputAction/actions]])
    type: String
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '2.10'
examples:
- |-
  To retrieve the following key's data, use the property name without 'key':
  <syntaxhighlight lang="cpp">keyWatch[] = { 24 };</syntaxhighlight>
  <sqf>actionKeysEx "Watch"; // [[[24, "KEYBOARD"], [], false]]</sqf>
- <sqf>private _result = actionKeysEx "OpticsMode"; // [[[129,"MOUSE_BUTTON"],[29,"KEYBOARD"],false],[[181,"KEYBOARD"],[],false]]</sqf>
see_also:
- actionKeys
- actionKeysNames
- actionKeysNamesArray
