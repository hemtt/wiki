name: setUnitPosWeak
desc: "Set unit position rules. This command is the lowest level of priority for setting unit position and to be used in scripted\t\nFSM's. Priorities are:\n# Unit pos commanded (from the commanding menu, higher priority).\n# Unit pos scripted (from [[setUnitPos]] scripting command, medium priority).\n# Unit pos FSM / '''setUnitPosWeak''' (used in the formation FSM, lowest priority)."
groups:
- Unit Control
syntax:
- call: !Binary
  - unit
  - mode
  ret:
    type: Nothing
  left: !Item
    name: unit
    type: Object
  right: !Item
    name: mode
    desc: |-
      can be:
      * "DOWN" - Unit goes prone and stays prone.
      * "UP" - Unit stands and stays standing.
      * "MIDDLE" - Kneel Position. {{GVI|arma1|1.04}} - Unit will not kneel if it is unarmed
      * "AUTO" - Unit chooses mode according to circumstances.
    type: String
argument_loc: Local
effect_loc: Global
since:
  arma1: '1.04'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- |-
  <sqf>
  _soldier disableAI "FSM";
  _soldier setUnitPosWeak "DOWN";
  </sqf>
see_also:
- FSM
- doFSM
- setUnitPos
- unitPos
