name: camCreate
desc: |-
  Create a camera or a seagull object on the given position. The creation happens immediately and doesn't wait for [[camCommit]].<br>
  Among other commands, [[cameraEffect]] must be used to enter the camera's view and [[camDestroy]] to delete the created camera. See also [[:Category:Command Group: Camera Control|Camera Control]].
  {{Feature|important|
  * Other objects can be created this way, but vehicles created with [[camCreate]] cannot be entered
  * Any unit created with [[camCreate]] will remain static
  * Unlike [[createVehicle]], objects are created exactly at the given position, without consideration of the surrounding objects.
  }}
multiplayer_note: camCreated objects are only visible locally (meaning they are client-side effects).
groups:
- Camera Control
syntax:
- call: !Binary
  - type
  - position
  ret:
    type: Object
    desc: the created camera
  left: !Item
    name: type
    desc: |-
      camera type, one of the following:
      * "camera"
      * "seagull" (a crow in {{arma2}})
      * "camconstruct"
      * "camcurator" (Since {{Name|arma3zeus}})
      * "crowe" (crow - {{arma3}})
      * or any vehicle class suitable to be spawned with camera
    type: String
  right: !Item
    name: position
    desc: position at which to create the object
    type: Position3dAGL
argument_loc: Unspecified
effect_loc: Local
since:
  ofp: '1.00'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_cam = "camera" camCreate (ASLToAGL eyePos player);</sqf>
- <sqf>_flr = "flare" camCreate (position _myPlane); // works too</sqf>
see_also:
- camCommand
- camDestroy
- camSetFocus
- camCommit
- setPiPEffect
- createVehicle
- createUnit
- showCinemaBorder
- cameraEffect
- cameraEffectEnableHUD
