name: formation
desc: Returns the current formation of a group.
groups:
- Groups
syntax:
- call: !Unary target
  ret:
    type: String
    desc: |-
      can return:
      * "COLUMN"
      * "STAG COLUMN"
      * "WEDGE"
      * "ECH LEFT"
      * "ECH RIGHT"
      * "VEE"
      * "LINE"
      * "FILE"
      * "DIAMOND"
  right: !Item
    name: target
    desc: or [[Group]]
    type: Object
argument_loc: Global
effect_loc: Unspecified
since:
  ofp: '1.00'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>if (formation group player == "wedge") then { hint "this is the default formation" };</sqf>
see_also:
- 2D
- 'Editor:'
- Waypoints#Formation|Formations
- Description
- formLeader
- setFormation
