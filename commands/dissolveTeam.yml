name: dissolveTeam
desc: Dissolves the given team. All members become members of the main team.
groups:
- Groups
syntax:
- call: !Unary teamColor
  ret:
    type: Nothing
  right: !Item
    name: teamColor
    desc: |-
      can be one of:
      * "RED"
      * "GREEN"
      * "BLUE"
      * "YELLOW"
    type: String
argument_loc: Local
effect_loc: Unspecified
since:
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>dissolveTeam "RED";</sqf>
see_also:
- assignTeam
- unassignTeam
