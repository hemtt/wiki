name: compileFinal
desc: |-
  Compiles an expression / takes an existing [[HashMap]] and makes it final, preventing it from being modified or overwritten (by [[=]] assignation, [[publicVariable]], [[set]] or any other command).
  {{Feature|informative|This feature is only available in the retail version of {{arma3}}.}}
groups:
- Strings
syntax:
- call: !Unary expression
  ret:
    type: Code
    desc: or [[HashMap]]
  right: !Item
    name: expression
    desc: ', {{GVI|arma3|2.14|size= 0.75}} [[Code]] or [[HashMap]]'
    type: String
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '0.56'
examples:
- "<sqf>\nMyCode = compileFinal \"a = a + 1\";\ncall MyCode;\n \n// repeated compile won't have any effect\nMyCode = compileFinal \"a = a + 2\";\n</sqf>"
- |-
  <sqf>
  // duplicate code will be final as well
  MyDuplicateCode = MyCode;

  // an alternative is to copy str'd code (since {{arma3}} v2.02)
  MyNonFinalCopy = compile toString MyCode;
  </sqf>
- |-
  <sqf>
  // since {{arma3}} v2.14
  ReadonlyCode = compileFinal { systemChat "Hello World!"; };
  ReadonlyHashMap = compileFinal _myHashMap;
  </sqf>
see_also:
- compile
- compileScript
- isFinal
- call
- spawn
