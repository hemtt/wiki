name: taskDestination
desc: Returns the position of the task (as specified by destination parameter in config).
groups:
- Briefing
syntax:
- call: !Unary task
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: (A3 1.28 Returns [[Nothing]] if identity is [[taskNull]])
  right: !Item
    name: task
    type: Task
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>if (!isNull currentTask player) then { hint str taskDestination currentTask player };</sqf>
see_also:
- cancelSimpleTaskDestination
- setSimpleTaskDestination
