name: trim
desc: Trims a [[String|string]].
groups:
- Strings
syntax:
- call: !Unary stringValue
  ret:
    type: String
    desc: trimmed string
  right: !Item
    name: stringValue
    desc: string to be trimmed. spaces, tabs and line returns are removed from both ends of ''stringValue''.
    type: String
- call: !Binary
  - string
  - - chars
    - where
  ret:
    type: String
    desc: trimmed string
  left: !Item
    name: string
    desc: string to be trimmed
    type: String
  right: !Array
  - !Item
    name: chars
    desc: list of characters to be trimmed
    type: String
  - !Item
    name: where
    desc: |-
      one of:
      * 0 - trim at the beginning (left) and the end (right)
      * 1 - trim at the beginning (left)
      * 2 - trim at the end (right)
    type: Number
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '2.02'
examples:
- "<sqf>trim \"\t\thello, how are you?  \"; // returns \"hello, how are you?\"</sqf>"
- <sqf>"hewosentence!123" trim ["3e1o2hw", 0]; // returns "sentence!"</sqf>
see_also:
- select
