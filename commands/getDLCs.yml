name: getDLCs
desc: Returns array of app IDs of DLCs.
groups:
- DLC
syntax:
- call: !Unary filter
  ret:
    type: !ArrayUnsized
      value: Number
    desc: App IDs
  right: !Item
    name: filter
    desc: |-
      one of:
      * 0 - all
      * 1 - owned
      * 2 - not owned
    type: Number
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.16'
examples:
- <sqf>_ownedDLCs = getDLCs 1;</sqf>
- <sqf>_hasKarts = (288520 in (getDLCs 1));</sqf>
see_also:
- getObjectDLC
- getPersonUsedDLCs
- getMissionDLCs
- getDLCAssetsUsageByName
- getDLCAssetsUsage
- getAssetDLCInfo
