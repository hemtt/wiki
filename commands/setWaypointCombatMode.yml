name: setWaypointCombatMode
desc: Changes a group's combat mode when the waypoint becomes active.
groups:
- Waypoints
syntax:
- call: !Binary
  - waypoint
  - mode
  ret:
    type: Nothing
  left: !Item
    name: waypoint
    type: Waypoint
  right: !Item
    name: mode
    desc: |-
      can be:
      * "NO CHANGE"
      * "BLUE"
      * "GREEN"
      * "WHITE"
      * "YELLOW"
      * "RED"
    type: String
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>[_grp, 2] setWaypointCombatMode "RED";</sqf>
see_also:
- Combat
- Modes
- setWaypointBehaviour
