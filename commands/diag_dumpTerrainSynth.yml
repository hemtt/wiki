name: diag_dumpTerrainSynth
desc: 'Returns [[Arma 3: CfgWorlds Config Reference#class OutsideTerrain|OutsideTerrain]]''s current world''s values.'
groups:
- Diagnostic
syntax:
- call: Nular
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: |-
      of [[Number]], [[Array]] of [[Number]]s: [analysisLength, [min1, max1], [min2, max2], ..., [min512, max512]]. There are 512 min/max pairs.
      * analysisLength: [[Number]] - altitude analysis distance from terrain's border towards its centre
      * min1..512: [[Number]] - minimum altitude
      * max1..512: [[Number]] - maximum altitude
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '2.04'
examples:
- <sqf>private _terrainSynth = diag_dumpTerrainSynth;</sqf>
see_also:
- diag_exportConfig
- diag_exportTerrainSVG
