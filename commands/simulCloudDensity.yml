name: simulCloudDensity
desc: Returns density of clouds at given position.
problem_notes:
- '{{Feature|Eden Editor|SimulWeather seems to be disabled in [[:Category:Eden Editor|Eden Editor]] and scenario preview.}}'
groups:
- Environment
syntax:
- call: !Unary pos
  ret:
    type: !Unknown Exceeded maximum recursion depth while parsing Value
    desc: |-
      density (0-1)
      * [[Nothing]] - If arguments are incorrect
      * [[Boolean]] - Returns [[false]] if simulWeather is disabled
  right: !Item
    name: pos
    type: Position
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.00'
examples:
- <sqf>simulCloudDensity getPos player;</sqf>
see_also:
- setSimulWeatherLayers
- simulCloudOcclusion
- simulInClouds
