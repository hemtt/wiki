name: getMissionLayerEntities
desc: |-
  Returns all entities within the specific [[Eden Editor: Layer|Eden Editor layer]] and its sub-layers.
  To be used when the scenario is running, not in the editor workspace.
  Useful to disable/enable whole parts of the scenario if layers are used during mission design.
  {{Feature|informative|Default layers are not returned.}}
groups:
- Eden Editor
- Mission Information
syntax:
- call: !Unary layerName
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: with [objects, markers, {{GVI|arma3|2.14|size= 0.75}} groups] (or empty array if the layer does not exist)
  right: !Item
    name: layerName
    desc: |-
      * [[String]] - case-insensitive; layer name in the editor. If multiple layers with the same name are present in the scenario, the first found one is used
      * [[Number]] - layer ID in the editor
    type: !Unknown Exceeded maximum recursion depth while parsing Value
argument_loc: Unspecified
effect_loc: Unspecified
server_exec: true
since:
  arma3: '1.56'
examples:
- <sqf>private _base = getMissionLayerEntities "Base";</sqf>
- "delete all objects within that layer after the player is over 800m away from _someObject:\n<sqf>\nwaitUntil { sleep 1; (player distance _someObject) > 800 };\nprivate _simpleObjects = (getMissionLayerEntities \"Simple Objects\") select 0;\n{\n\tdeleteVehicle _x;\n} forEach _simpleObjects;\n</sqf>"
- <sqf>private _layer1337Entities = getMissionLayerEntities 1337;</sqf>
- <sqf>getMissionLayerEntities 42 params [["_objects", []], ["_markers", []], ["_groups", []]];</sqf>
see_also:
- get3DENLayerEntities
