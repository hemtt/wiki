name: allObjects
desc: |-
  Returns array of requested objects as fast as the engine allows it. The objects can be requested by object type and simulation kind.
  {{Feature|informative|This command does not return terrain placed objects (except for terrain objects with lights, such as lamp posts, etc. which can be found in the slow entities collection). To get all terrain objects, use [[nearestTerrainObjects]] instead.}}
groups:
- Object Detection
syntax:
- call: !Binary
  - objectType
  - objectCollection
  ret:
    type: !ArrayUnsized
      value: Object
  left: !Item
    name: objectType
    desc: type can be a combination of types according to bit flag operation (see [[getObjectType]])
    type: !NumberEnum
    - value: -1
      desc: '{{GVI|arma3|2.12|size= 0.75}} All types incl. nulls (nulls exist with ''objectCollection'' 7 and 8)'
      since: null
    - value: 1
      desc: Primary - normal object placed in Terrain Builder, part of landscape
      since: null
    - value: 2
      desc: Network - road placed in Terrain Builder, part of landscape
      since: null
    - value: 4
      desc: Temporary - temporary object (like vehicle tracks)
      since: null
    - value: 8
      desc: TypeVehicle - entity added by game
      since: null
    - value: 16
      desc: TypeTempVehicle - temporary entity
      since: null
    - value: 32
      desc: LandDecal - land decal
      since: null
  right: !Item
    name: objectCollection
    desc: supported values
    type: !NumberEnum
    - value: 0
      desc: 'Slow (and very slow) entities: some houses, rubbles, street lamps, churches, etc'
      since: null
    - value: 1
      desc: 'Normal entities: vehicles etc'
      since: null
    - value: 2
      desc: 'Fast entities: shots and other high precision entities'
      since: null
    - value: 3
      desc: 'Cloudlets: smokes, dust, etc'
      since: null
    - value: 4
      desc: 'Out vehicles: objects that are not listed anywhere else, holders, etc'
      since: null
    - value: 5
      desc: 'Animals: animals, birds, insects, etc'
      since: null
    - value: 6
      desc: 'Mines: mines'
      since: null
    - value: 7
      desc: '{{GVI|arma3|2.12|size= 0.75}} Sensor map: ordered triggers. When trigger is created it is added to this collection in the order of creation. When deleted it becomes null. Use ''objectType'' -1 to include nulls'
      since: null
    - value: 8
      desc: '{{GVI|arma3|2.12|size= 0.75}} Vehicle map: ordered vehicles. When vehicle is created it is added to this collection in the order of creation. When deleted it becomes null. Use ''objectType'' -1 to include nulls'
      since: null
    - value: 9
      desc: '{{GVI|arma3|2.18|size= 0.75}} Vehicles and crew: normal entities as in 1 as well as crew if an entity is a vehcile with crew.'
      since: null
    - value: 10
      desc: '{{GVI|arma3|2.22|size= 0.75}} Windlets: all objects of the type ''#windlet''.'
      since: null
    - value: 11
      desc: '{{GVI|arma3|2.22|size= 0.75}} Active windlets: all objects of the type ''#windlet'' which are enabled.'
      since: null
- call: !Binary
  - objectType
  - objectCollection
  ret:
    type: !ArrayUnsized
      value: Object
  left: !Item
    name: objectType
    desc: type of the objects (will exact match return of [[typeOf]])
    type: String
  right: !Item
    name: objectCollection
    desc: see main syntax above
    type: Number
  since:
    arma3: '2.12'
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '2.10'
examples:
- <sqf>private _visitorBuildings = 1 allObjects 0;</sqf>
- <sqf>private _userPlacedBuildings = 8 allObjects 0;</sqf>
- "<sqf>\nonEachFrame\n{\n\thintSilent str\n\t[\n\t\tcount (63 allObjects 0),\n\t\tcount (63 allObjects 1),\n\t\tcount (63 allObjects 2),\n\t\tcount (63 allObjects 3),\n\t\tcount (63 allObjects 4),\n\t\tcount (63 allObjects 5),\n\t\tcount (63 allObjects 6)\n\t];\n};\n</sqf>"
- |-
  <sqf>
  private _allGroundWeaponHolders = "GroundWeaponHolder" allObjects 0;
  private _allSimulatedWeaponHolders = "WeaponHolderSimulated" allObjects 1;
  </sqf>
