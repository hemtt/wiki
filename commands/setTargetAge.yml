name: setTargetAge
desc: Sets how the target is known to the other centers. They behave like the target was seen age seconds ago.
groups:
- Object Manipulation
syntax:
- call: !Binary
  - object
  - age
  ret:
    type: Nothing
  left: !Item
    name: object
    type: Object
  right: !Item
    name: age
    desc: |-
      can be:
      * "ACTUAL"
      * "5 MIN"
      * "10 MIN"
      * "15 MIN"
      * "30 MIN"
      * "60 MIN"
      * "120 MIN"
      * "UNKNOWN"
    type: String
argument_loc: Unspecified
effect_loc: Unspecified
since:
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>player setTargetAge "10 MIN";</sqf>
see_also:
- targets
- targetsQuery
- nearTargets
- targetsAggregate
- targetKnowledge
- knowsAbout
- reveal
- forgetTarget
- getHideFrom
