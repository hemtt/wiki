name: nearestLocationWithDubbing
desc: |-
  Find the nearest location having a non-empty speech.
  {{Feature|arma3|No locations are dubbed in {{arma3}}.}}
groups:
- Locations
syntax:
- call: !Unary position
  ret:
    type: Location
  right: !Item
    name: position
    desc: or [[Position#Introduction|Position2D]]
    type: Position3dAGL
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_location = nearestLocationWithDubbing ASLToAGL getPosASL player;</sqf>
- <sqf>_location = nearestLocationWithDubbing getMarkerPos "myMarker";</sqf>
see_also:
- findNearestEnemy
- nearestBuilding
- nearestObject
- nearestObjects
- nearObjects
- nearestLocation
- nearEntities
- nearTargets
- nearSupplies
- nearObjectsReady
- nearRoads
- nearestMines
