name: getWPPos
desc: Returns the position of a selected waypoint of a given group. Waypoints include only those which were placed in the mission editor.
alias:
- '[[waypointPosition]]'
groups:
- Waypoints
syntax:
- call: !Unary
  - groupOrUnit
  - index
  ret:
    type: Position3d
    desc: the returned position equals [0,0,0] if the selected waypoint does not exist.
  right: !Array
  - !Item
    name: groupOrUnit
    desc: the group (or unit) of which to select a waypoint
    type: !OneOf
    - type: Group
      desc: null
      since: null
    - type: Object
      desc: null
      since: null
  - !Item
    name: index
    desc: 0 equals the starting position of the group.<br>
    type: Number
argument_loc: Global
effect_loc: Unspecified
since:
  ofp: '1.21'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- |-
  <sqf>
  [_group1, 1] setWPPos [200,600,0];
  _pos = getWPPos [_group1, 1]; // returns [200, 600, 0]
  </sqf>
see_also:
- setWPPos
