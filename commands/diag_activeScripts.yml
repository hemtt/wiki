name: diag_activeScripts
desc: Returns 4 element array with numbers of currently running scripts
groups:
- Diagnostic
syntax:
- call: Nular
  ret:
    type: !ArraySized
    - name: spawn
      type: Number
      default: null
      desc: The number of scripts running with [[spawn]]
      since: null
    - name: execVM
      type: Number
      default: null
      desc: The number of scripts running with [[execVM]]
      since: null
    - name: exec
      type: Number
      default: null
      desc: The number of scripts running with [[exec]]
      since: null
    - name: execFSM
      type: Number
      default: null
      desc: The number of scripts running with [[execFSM]]
      since: null
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.64'
examples:
- <sqf>hint str diag_activeScripts; //[0,0,0,1]</sqf>
see_also:
- diag_log
- diag_fps
- diag_fpsmin
- diag_frameno
- diag_tickTime
- diag_activeSQFScripts
- diag_activeSQSScripts
- diag_activeMissionFSMs
