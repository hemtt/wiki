name: locked
desc: Check if [[vehicle]] is locked. If it is locked, [[Object#Person|Persons]] cannot mount / dismount without order.
groups:
- Object Manipulation
syntax:
- call: !Unary vehicle
  ret:
    type: !Unknown Exceeded maximum recursion depth while parsing Value
    desc: |-
      since {{GVI|arma3|0.50}}
      ** 0: Unlocked
      ** 1: Default - a subordinate player cannot enter without AI leader order
      ** 2: Locked
      ** 3: Locked for player
      ** -1: vehicle [[isNull|is null]]
      * [[Boolean]] for older games
  right: !Item
    name: vehicle
    type: Object
argument_loc: Global
effect_loc: Unspecified
since:
  ofp: '1.00'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_locked = locked _jeepOne;</sqf>
see_also:
- lock
- setVehicleLock
- lockedDriver
- lockedCargo
- lockedTurret
