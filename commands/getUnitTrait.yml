name: getUnitTrait
desc: |-
  Gets the current value of a trait of the given unit.
  {{Feature|informative|For the default values see {{Link|setUnitTrait}}.}}
groups:
- Object Manipulation
syntax:
- call: !Binary
  - unit
  - skillName
  ret:
    type: !Unknown Exceeded maximum recursion depth while parsing Value
    desc: |-
      trait's value
      * [[Nothing]] - if ''unit'' is invalid, e.g an empty vehicle
  left: !Item
    name: unit
    type: Object
  right: !Item
    name: skillName
    desc: name of the skill
    type: String
argument_loc: Global
effect_loc: Unspecified
since:
  arma3: '1.58'
examples:
- <sqf>player getUnitTrait "Medic";</sqf>
see_also:
- setUnitTrait
- getAllUnitTraits
