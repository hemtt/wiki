name: kbReact
desc: Pass a non-verbal communication to the receiver. This command does '''as if''' the sentence was said and triggers the reaction scripts (AI FSM or player's conversation EH). See [[Conversations]] for more details.
groups:
- Conversations
syntax:
- call: !Binary
  - person
  - - receiver
    - topicName
    - sentenceID
    - argumentArrayN
  ret:
    type: Nothing
  left: !Item
    name: person
    type: Object
  right: !Array
  - !Item
    name: receiver
    type: Object
  - !Item
    name: topicName
    type: String
  - !Item
    name: sentenceID
    type: String
  - !Infinite
    - !Item
      name: argumentArrayN
      desc: |-
        in format [argumentName, argumentValue, argumentText, argumentSpeech]:
        * argumentName: [[String]]
        * argumentValue: [[Code]]
        * argumentText: [[String]]
        * argumentSpeech: [[Array]] of [[String]]s - each string is an already defined word in config.
      type: !Unknown 'Unknown simple type: array'
      optional: true
argument_loc: Global
effect_loc: Local
since:
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- |-
  <sqf>
  // will trigger AS IF unit1 said the sentence (via kbTell)
  // unit2's FSM will react accordingly.
  unit1 kbReact [unit2, "topicName", "speech1"];
  </sqf>
see_also:
- Conversations
- kbAddTopic
- kbHasTopic
- kbTell
- kbWasSaid
- kbRemoveTopic
- kbAddDatabase
- kbAddDatabaseTargets
- FSM
- FSM
- Editor
