name: skill
desc: |-
  Returns current skill of a unit, in range between 0 to 1, 1 being the highest level of skill.

  {{Feature|informative|
  * Skill of AI units set via the slider in unit placement screen varies from 0.2 to 1.0.
  * If the '''superAI''' difficulty settings is enabled, all units have skill of 1.0 regardless of the skill slider.
  }}
groups:
- AI Behaviour
syntax:
- call: !Unary unit
  ret:
    type: Number
  right: !Item
    name: unit
    type: Object
- call: !Binary
  - unit
  - skillName
  ret:
    type: Number
  left: !Item
    name: unit
    type: Object
  right: !Item
    name: skillName
    desc: |-
      possible values are:
      * "aimingAccuracy"
      * "aimingShake"
      * "aimingSpeed"
      * "endurance"
      * "spotDistance"
      * "spotTime"
      * "courage"
      * "reloadSpeed"
      * "commanding"
      * "general"
    type: String
  since:
    arma1: '1.00'
argument_loc: Unspecified
effect_loc: Unspecified
since:
  ofp: '1.75'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_skill = skill unit1;</sqf>
- <sqf>_myCourage = player skill "courage";</sqf>
see_also:
- skillFinal
- setSkill
- setUnitAbility
- Arma
- '3:'
- AI
- Skill
- Combat
- Modes
