name: move3DENCamera
desc: Moves the [[get3DENCamera|Eden Editor camera]].
groups:
- Eden Editor
syntax:
- call: !Unary
  - position
  - useOffset
  ret:
    type: Nothing
  right: !Array
  - !Item
    name: position
    desc: new position
    type: Position3dASL
  - !Item
    name: useOffset
    desc: |-
      * if [[true]] the camera will move to the ''position'', add the offset defined in <sqf inline>configFile >> "Cfg3DEN" >> "Camera" >> "moveOffset"</sqf> and look at the ''position''.  Default camera offset: {{hl|[0, -25, 25]}}
      * if [[false]], the camera will be moved to the exact ''position''
    type: Boolean
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.56'
examples:
- <sqf>move3DENCamera [getPosASL player, true];</sqf>
see_also:
- get3DENCamera
