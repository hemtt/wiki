name: getPilotCameraRotation
desc: Returns rotation (relative to the centered camera position) of the object airplane or helicopter [[A3_Targeting_config_reference#class_pilotCamera|pilotCamera]] .
groups:
- Pilot Camera
syntax:
- call: !Unary object
  ret:
    type: !Unknown Exceeded maximum recursion depth while parsing Value
    desc: positive values are left yaw and down pitch from the center. Returns [0,0] when camera is centered but also if object has no [[A3_Targeting_config_reference#class_pilotCamera|pilotCamera]].
  right: !Item
    name: object
    type: Object
argument_loc: Local
effect_loc: Unspecified
since:
  arma3: '1.64'
examples:
- <sqf>_pilotCamRot = getPilotCameraRotation vehicle player;</sqf>
see_also:
- hasPilotCamera
- getPilotCameraPosition
- getPilotCameraDirection
- getPilotCameraTarget
- setPilotCameraDirection
- setPilotCameraRotation
- setPilotCameraTarget
