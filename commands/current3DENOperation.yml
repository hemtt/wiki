name: current3DENOperation
desc: Returns the currently performed editing operation in [[:Category:Eden Editor|Eden Editor]].
groups:
- Eden Editor
syntax:
- call: Nular
  ret:
    type: String
    desc: |-
      operation name. Can be:
      * {{hl|""}} (no operation)
      * {{hl|"CreateObject"}}
      * {{hl|"CreateMarker"}}
      * {{hl|"CreateTrigger"}}
      * {{hl|"MoveItems"}}
      * {{hl|"RotateItems"}}
      * {{hl|"ScaleItems"}}
      * {{hl|"SyncWith"}}
      * {{hl|"GroupWith"}}
      * {{hl|"SetTriggerOwner"}}
      * {{hl|"AddRandomStart"}}
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.56'
examples:
- <sqf>if (current3DENOperation == "MoveItems") then { hint "Moving things are we"; };</sqf>
see_also:
- do3DENAction
- get3DENActionState
