name: countSide
desc: Returns how many units in the given array belong to given side.
groups:
- Sides
- Object Detection
syntax:
- call: !Binary
  - side
  - array
  ret:
    type: Number
  left: !Item
    name: side
    type: Side
  right: !Item
    name: array
    type: !ArrayUnsized
      value: !OneOf
      - type: Object
        desc: null
        since: null
      - type: Group
        desc: null
        since: null
argument_loc: Global
effect_loc: Unspecified
since:
  ofp: '1.00'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_num = west countSide list _triggerOne;</sqf>
- <sqf>_numCivPlayable = civilian countSide playableUnits;</sqf>
see_also:
- countFriendly
- countEnemy
- countUnknown
- count
- countType
- playersNumber
- units
- allUnits
