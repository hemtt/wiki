name: tvSetColor
desc: Sets text color on given Tree View Item
groups:
- GUI Control - Tree View
syntax:
- call: !Binary
  - control
  - - path
    - color
  ret:
    type: Nothing
  left: !Item
    name: control
    type: Control
  right: !Array
  - !Item
    name: path
    type: TreeViewPath
  - !Item
    name: color
    type: ArrayColorRgba
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '0.74'
examples:
- <sqf>_ctrl tvSetColor [[0,0], [1,0,0,1]];</sqf>
see_also:
- tvDelete
- tvAdd
- tvClear
- tvCollapse
- tvCount
- tvCurSel
- tvData
- tvExpand
- tvPicture
- tvSetCurSel
- tvSetData
- tvSetPicture
- tvSetValue
- tvSort
- tvSortByValue
- tvText
- tvValue
