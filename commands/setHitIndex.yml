name: setHitIndex
desc: Sets the current level of damage for a specific Hit Point. All hit points can be obtained with [[getAllHitPointsDamage]] command.
groups:
- Object Manipulation
syntax:
- call: !Binary
  - vehicle
  - - hitPartIndex
    - damage
    - useEffects
    - killer
    - instigator
    - breakRotor
  ret:
    type: Nothing
  left: !Item
    name: vehicle
    desc: vehicle to be damaged
    type: Object
  right: !Array
  - !Item
    name: hitPartIndex
    desc: hit part index of the Hit Point
    type: Number
  - !Item
    name: damage
    desc: level of damage, 0 = no damage, 1 = full damage
    type: !NumberRange
    - 0
    - 1
  - !Item
    name: useEffects
    desc: '[[false]] to skip destruction effects'
    type: Boolean
    optional: true
    default: 'true'
    since:
      arma3: '1.68'
  - !Item
    name: killer
    desc: |-
      the entity that caused the damage. If the damage leads to the death of the unit, the killer will be used as the object that caused the kill. <br>
      * It can be used to show "killed by player" in debriefing statistics and kill messages in the chat (if death messages are enabled). <br>
      * It will alter the killer's [[rating]] as if the killer directly killed the unit. <br>
      * It will be listed as <sqf inline>_killer</sqf> parameter in the [[Arma_3:_Event_Handlers#Killed|Killed]] event handler.
    type: Object
    optional: true
    default: objnull
    since:
      arma3: '2.08'
  - !Item
    name: instigator
    desc: |-
      the person that instigated the damage.
      * if a tank is a killer, the tank gunner that pulled the trigger is instigator
      * it will be listed as <sqf inline>_instigator</sqf> parameter in the [[Arma 3: Event Handlers#Killed|Killed]] event handler.
    type: Object
    optional: true
    default: objnull
    since:
      arma3: '2.12'
  - !Item
    name: breakRotor
    desc: if the hitpoint is rotor on a helicopter, [[true]] will break the rotor as well as play corresponding sound if 'useEffects' is also [[true]].
    type: Boolean
    optional: true
    default: 'false'
    since:
      arma3: '2.18'
argument_loc: Local
effect_loc: Global
since:
  arma3: '1.50'
examples:
- <sqf>vehicle player setHitIndex [1, 1];</sqf>
- <sqf>player setHitIndex [7, 0.5];</sqf>
see_also:
- getAllHitPointsDamage
- getHitIndex
- getHitPointDamage
- setHitPointDamage
- setHit
- getHit
- setDamage
- damage
- forceHitPointsDamageSync
