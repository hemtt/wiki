name: playSound
desc: Plays a sound from CfgSounds. Sound can be defined in [[missionConfigFile]], [[configFile]] or [[campaignConfigFile]].
groups:
- Sounds
syntax:
- call: !Unary soundName
  ret:
    type: Object
    desc: the speaker object ([[Nothing]] before {{GVI|arma3|2.00|size= 0.75}})
  right: !Item
    name: soundName
    type: String
- call: !Unary
  - soundName
  - isSpeech
  - offset
  ret:
    type: Object
    desc: the speaker object ([[Nothing]] before {{GVI|arma3|2.00|size= 0.75}})
  right: !Array
  - !Item
    name: soundName
    type: String
  - !Item
    name: isSpeech
    desc: (Optional, default [[false]])
    type: !OneOf
    - type: Boolean
      desc: |-
        0/[[false]] = play as sound ([[fadeSound]] applies)
        1/[[true]] = play as speech ([[fadeSpeech]] applies), filters are not applied to it (i.e. house or vehicle interior one)
        2 = play as sound ([[fadeSound]] applies) without interior/vehicle muffling
      since: null
    - type: !NumberEnum
      - value: 0
        desc: play as sound ([[fadeSound]] applies)
        since: null
      - value: 1
        desc: play as speech ([[fadeSpeech]] applies), filters are not applied to it (i.e. house or vehicle interior one)
        since: null
      - value: 2
        desc: play as sound ([[fadeSound]] applies) without interior/vehicle muffling
        since: null
      desc: null
      since:
        arma3: '2.04'
  - !Item
    name: offset
    desc: offset in seconds. Same as [[playMusic]]
    type: Number
    optional: true
    default: '0'
    since:
      arma3: '2.00'
argument_loc: Unspecified
effect_loc: Local
since:
  ofp: '1.00'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>playSound "soundname";</sqf>
- "Start a sound and then stop it after 1.2 second:\n<sqf>\nplaySound \"AlarmCar\";\n0 spawn\n{\n\t_sound = ASLToAGL [0,0,0] nearestObject \"#soundonvehicle\";\n\tsleep 1.2;\n\tdeleteVehicle _sound;\n};\n\n// since {{arma3}} v2.00\n_source = playSound \"AlarmCar\";\n_source spawn\n{\n\tsleep 1.2;\n\tdeleteVehicle _this;\n};\n</sqf>"
- "Start a sound and wait until it is finished:\n<sqf>\nplaySound \"Alarm\";\nhint \"Started!\";\n0 spawn\n{\n\t_sound = ASLToAGL [0,0,0] nearestObject \"#soundonvehicle\";\n\twaitUntil {isNull _sound};\n\thint \"Finished!\";\n};\n\n// since {{arma3}} v2.00\nprivate _source = playSound \"Alarm\";\n_source spawn\n{\n\twaitUntil { isNull _this };\n\thint \"Finished!\";\n};\n</sqf>"
see_also:
- playSound3D
- sideRadio
- say
- playMusic
- say2D
- say3D
- createSoundSource
- playSoundUI
