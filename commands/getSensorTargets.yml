name: getSensorTargets
desc: Returns vehicle sensors' potential targets.
groups:
- Sensors
syntax:
- call: !Unary vehicle
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: |-
      of [[Array]]s format [[target, type, relationship, sensor], ...]:
      * target: [[Object]]
      * type: [[String]] - can be one of:
      ** "unknown"
      ** "footmobile"
      ** "air"
      ** "ground"
      ** "laserTarget"
      ** "irTarget"
      ** "radarTarget"
      * relationship: [[String]] - can be one of:
      ** "friendly"
      ** "enemy"
      ** "destroyed"
      ** "unknown"
      * sensor: [[Array]] of [[String]]s - among the following values:
      ** "ir"
      ** "nv"
      ** "laser"
      ** "activeradar"
      ** "passiveradar"
      ** "man"
      ** "visual"
      ** "datalink"
  right: !Item
    name: vehicle
    desc: the sensors-equipped vehicle
    type: Object
argument_loc: Local
effect_loc: Unspecified
since:
  arma3: '2.06'
examples:
- "<sqf>\nprivate _radarTargets = getSensorTargets vehicle player;\n/*\n\treturns e.g\n\t[\n\t\t[O Alpha 1-3:1, \"air\", \"unknown\", [\"ir\", \"activeradar\", \"visual\"]],\n\t\t[17750112040# 163957: apc_tracked_01_aa_f.p3d, \"ground\", \"unknown\", [\"datalink\"]]\n\t]\n*/\n</sqf>"
see_also:
- getSensorThreats
- listVehicleSensors
- listRemoteTargets
