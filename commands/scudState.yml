name: scudState
desc: Return the current state of given Scud launcher.
groups:
- Object Manipulation
syntax:
- call: !Unary scudName
  ret:
    type: !NumberEnum
    - value: 0
      desc: No activity
      since: null
    - value: 1
      desc: Launch preparation
      since: null
    - value: 2
      desc: Launch prepared
      since: null
    - value: 3
      desc: Ignition
      since: null
    - value: 4
      desc: Launched
      since: null
    desc: can be one of
  right: !Item
    name: scudName
    type: Object
argument_loc: Unspecified
effect_loc: Unspecified
since:
  ofp: '1.30'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- |-
  <sqf>
  waitUntil { sleep 1; scudState _scud > 2 };
  guba say "MasterPlanCompletion";
  </sqf>
see_also:
- action
- Arma
- '3:'
- Actions#ScudStart|"ScudStart"
- action
- Arma
- '3:'
- Actions#ScudLaunch|"ScudLaunch"
- action
