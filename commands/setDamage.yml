name: setDamage
desc: "{{{!}} class=\"wikitable float-right align-center-col-2\"\n{{!}}+ \n! {{Link|Category: Event Handlers|Event Handler}}\n! Triggered\n{{!}}-\n{{!}} {{hl|Hit}}\n{{!}} {{Icon|unchecked}}\n{{!}}-\n{{!}} {{hl|HandleDamage}}\n{{!}} {{Icon|unchecked}}\n{{!}}-\n{{!}} {{hl|Killed}}\n{{!}} {{Icon|checked}}\n{{!}}-\n{{!}} {{hl|MPKilled}}\n{{!}} {{Icon|checked}}\n{{!}}}\n\nSets the damage (or lack thereof) of an object/unit. The alternative syntax allows to skip destruction effects for vehicles and buildings and set a tree/pole/wall fall direction (away from ''killer'')."
alias:
- '[[setDammage]]'
groups:
- Object Manipulation
syntax:
- call: !Binary
  - object
  - damage
  ret:
    type: Nothing
  left: !Item
    name: object
    type: Object
  right: !Item
    name: damage
    desc: range 0..1, 0 = pristine/healthy condition, 1 = entirely destroyed/killed
    type: Number
- call: !Binary
  - object
  - - damage
    - useEffects
    - killer
    - instigator
    - allowResurrection
  ret:
    type: Nothing
  left: !Item
    name: object
    type: Object
  right: !Array
  - !Item
    name: damage
    desc: range 0..1, 0 = pristine/healthy condition, 1 = entirely destroyed/killed
    type: Number
  - !Item
    name: useEffects
    desc: '[[false]] to skip destruction effects'
    type: !Unknown Exceeded maximum recursion depth while parsing Value
  - !Item
    name: killer
    desc: |-
      {{Icon|serverExec|28}} the entity that caused the damage (can be anything). If the damage leads to the death of the unit, the killer will be used as the object that caused the kill.
      * it can be used to show "killed by player" in debriefing statistics and kill messages in the chat (if death messages are enabled).
      * it will alter the killer's [[rating]] as if the killer directly killed the unit
      * it will be listed as <sqf inline>_killer</sqf> parameter in the [[Arma 3: Event Handlers#Killed|Killed]] event handler
      * it influences a tree/pole/wall fall direction (it will fall ''away'' from ''killer'')
      * ''killer'' is ignored if [[setDamage]] is called on a player client machine unless ''object'' is one of these three entity types - see {{Link|#Example 3}}
      * MP restricted similar to [[setShotParents]], will be ignored unless executed on the server or headless client in MP
    type: Object
    optional: true
    default: objnull
    since:
      arma3: '2.12'
  - !Item
    name: instigator
    desc: |-
      {{Icon|serverExec|28}} the person that instigated the damage.
      * if a tank is a killer, the tank gunner that pulled the trigger is instigator
      * it will be listed as <sqf inline>_instigator</sqf> parameter in the [[Arma 3: Event Handlers#Killed|Killed]] event handler
      * MP restricted similar to [[setShotParents]], will be ignored unless executed on the server or headless client in MP
      ** the above MP restriction does not apply to trees, poles and walls
    type: Object
    optional: true
    default: objnull
    since:
      arma3: '2.12'
  - !Item
    name: allowResurrection
    desc: '- Will re-set [[alive]] state of previously dead object.'
    type: Boolean
    optional: true
    default: 'false'
    since:
      arma3: '2.22'
  since:
    arma3: '1.68'
argument_loc: Global
effect_loc: Global
since:
  ofp: '0.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_soldier1 setDamage 1;</sqf>
- <sqf>_house1 setDamage [1, false];</sqf>
- "<sqf>\n// executed on a client\n_remoteVehicle setDamage [1, true, player];\t// killer (here, player) is not considered if the command is not called on the server\n\t\t\t\t\t\t\t\t\t\t\t// the vehicle still gets destroyed\n\n_tree setDamage [1, true, player];\t\t\t// the tree is destroyed and falls away from the player\n_pole setDamage [1, true, player];\t\t\t// these three cases are the only ones where ''killer'' is considered\n_wall setDamage [1, true, player];\t\t\t// when setDamage is called on a non-server machine (neither server or headless client)\n</sqf>"
see_also:
- setVehicleArmor
- damage
- setHit
- getHit
- getHitIndex
- setHitIndex
- getHitPointDamage
- setHitPointDamage
