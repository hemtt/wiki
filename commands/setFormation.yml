name: setFormation
desc: Set group formation.
groups:
- Groups
syntax:
- call: !Binary
  - group
  - formation
  ret:
    type: Nothing
  left: !Item
    name: group
    desc: or [[Group]]
    type: Object
  right: !Item
    name: formation
    desc: |-
      can be one of:
      * "COLUMN"
      * "STAG COLUMN"
      * "WEDGE"
      * "ECH LEFT"
      * "ECH RIGHT"
      * "VEE"
      * "LINE"
      * {{GVI|arma1|1.00|size= 0.75}} "FILE"
      * {{GVI|arma1|1.00|size= 0.75}} "DIAMOND"
    type: String
argument_loc: Local
effect_loc: Global
since:
  ofp: '1.00'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_groupOne setFormation "LINE";</sqf>
see_also:
- Mission_Editor:_Waypoints#Formation|formations
- description
- formation
