name: mineDetectedBy
desc: Returns [[true]] if mine has been detected by a given side
groups:
- Mines
syntax:
- call: !Binary
  - mine
  - side
  ret:
    type: Boolean
  left: !Item
    name: mine
    type: Object
  right: !Item
    name: side
    type: Side
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.24'
examples:
- "<sqf>\nif (_myMine mineDetectedBy opfor) then\n{\n\thint \"Children yearn for the mines\";\n};\n</sqf>"
see_also:
- allMines
- detectedMines
- createMine
- mineActive
- revealMine
