name: setVariable
desc: |-
  Set variable to given value in the variable space of given element. Can be used to broadcast variables over the network.<br>
  To remove a variable, set it to [[nil]] (see {{Link|#Example 5}}) - note that this does not work on [[Object]] and [[createLocation|scripted]] [[Location]] namespaces (the variable will be set to [[nil]] but will remain listed by [[allVariables]]).

  {{Feature|warning|
  [[missionNamespace]], [[uiNamespace]], [[parsingNamespace]] and [[profileNamespace]] variables '''cannot''' be named as commands - e.g <sqf inline>missionNamespace setVariable ["west", 123];</sqf> conflicts with the [[west]] command and will result in a {{hl|Reserved variable in expression}} error, [[west]] being a scripting command (other namespaces do not have such limitation).
  See also [[:Category:Scripting Commands|all available script commands]].
  }}
groups:
- Variables
- Namespaces
- Multiplayer
syntax:
- call: !Binary
  - varspace
  - - name
    - value
    - public
  ret:
    type: Nothing
  left: !Item
    name: varspace
    desc: |-
      * [[Namespace]]
      * [[Object]]
      ** {{Icon|checked}} {{GVI|arma3|2.10|size= 0.75}} {{hl|CfgAmmo}} [[Object]]s (bullets, mines etc)
      ** {{Icon|unchecked}} {{hl|CfgNonAIVehicles}} [[Object]]s (butterflies, proxies etc - {{hl|EmptyDetector}}s (triggers) work)
      ** {{Icon|unchecked}} {{hl|#local}} [[Object]]s ({{hl|#lightpoint}}, {{hl|#soundsource}} etc - see [[createVehicleLocal]])
      * [[Group]]
      * [[Location]] ({{GVI|arma3|2.10|size= 0.75}} [[createLocation|scripted ones]] only)
      * {{GVI|arma2|1.00|size= 0.75}} [[Team Member]]
      * {{GVI|arma2|1.00|size= 0.75}} [[Task]] - ''value'' will actually be set on the [[Task]]'s [[FSM]] if it exists.
      * {{GVI|arma3|0.50|size= 0.75}} [[Control]]
      * {{GVI|arma3|0.50|size= 0.75}} [[Display]]
    type: !Unknown Exceeded maximum recursion depth while parsing Value
  right: !Array
  - !Item
    name: name
    desc: variable name ([[Identifier]])
    type: String
  - !Item
    name: value
    desc: variable value
    type: Anything
  - !Item
    name: public
    desc: |-
      if set to [[true]], the variable is broadcast globally and is persistent ([[Multiplayer Scripting#Join In Progress|JIP]] compatible) {{Icon|globalEffect|32}}
      the variable is only set on the client with the given [[Multiplayer Scripting#Machine network ID|Machine network ID]]. If the number is negative, the variable is set on every client except for the one with the given ID.
      [[Array]] of [[Number]]s - array of [[Multiplayer Scripting#Machine network ID|Machine network IDs]]
    type: !OneOf
    - type: Boolean
      desc: if set to [[true]], the variable is broadcast globally and is persistent ([[Multiplayer Scripting#Join In Progress|JIP]] compatible) {{Icon|globalEffect|32}}
      since: null
    - type: Number
      desc: the variable is only set on the client with the given [[Multiplayer Scripting#Machine network ID|Machine network ID]]. If the number is negative, the variable is set on every client except for the one with the given ID.
      since: null
    - type: !ArrayUnsized
        value: Number
      desc: array of [[Multiplayer Scripting#Machine network ID|Machine network IDs]]
      since: null
    since:
      arma2: '1.00'
argument_loc: Global
effect_loc: Local
since:
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_myTruck setVariable ["TAG_myPublicVariable", 123, true];</sqf>
- <sqf>_myTruck setVariable ["TAG_myLocalVariable", ["321", _var], owner driver _myTruck];</sqf>
- |-
  <sqf>
  missionNamespace setVariable ["TAG_myName", "Brian"];
  hint TAG_myName; // hints "Brian"
  </sqf>
- "Get the current value of a variable or, if it is undefined, define it and then get the value:\n<sqf>\nprivate _var = missionNamespace getVariable \"VarName\";\nif (isNil \"_var\") then\n{\n\t_var = 123;\n\tmissionNamespace setVariable [\"VarName\", _var];\n};\n// _var now contains the current value of the missionNamespace's variable varName\n</sqf>"
- |-
  Remove {{hl|TAG_myPublicVariable}} from [[missionNamespace]] (globally):
  <sqf>missionNamespace setVariable ["TAG_myPublicVariable", nil, true];</sqf>
see_also:
- getVariable
- allVariables
- setFSMVariable
