name: lbSetPictureRightColorDisabled
desc: |-
  Sets the disabled color of second (right aligned) picture of the item with the given index of the listbox to the given color.
  Color which consists from only zeros means disable this override.
groups:
- GUI Control - ListBox
syntax:
- call: !Binary
  - control
  - - index
    - color
  ret:
    type: Nothing
  left: !Item
    name: control
    type: Control
  right: !Array
  - !Item
    name: index
    type: Number
  - !Item
    name: color
    type: ArrayColorRgba
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.20'
examples:
- <sqf>_ctrl lbSetPictureRightColorDisabled [0, [1, 1, 1, 0.25]];</sqf>
see_also:
- lbAdd
- lbClear
- lbColor
- lbCurSel
- lbData
- lbDelete
- lbIsSelected
- lbPicture
- lbSelection
- lbSetColor
- lbSetCurSel
- lbSetData
- lbSetSelected
- lbSetTooltip
- lbSetValue
- lbSize
- lbSort
- lbSortByValue
- lbText
- lbValue
- lbSetPicture
- lbSetPictureColor
- lbSetPictureColorDisabled
- lbSetPictureColorSelected
