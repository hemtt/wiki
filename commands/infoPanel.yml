name: infoPanel
desc: Returns information about what is currently displayed on given player's info panel.
groups:
- Custom Panels
syntax:
- call: !Unary infoPanelId
  ret:
    type: !ArraySized
    - name: componentClass
      type: String
      default: null
      desc: '''''EmptyDisplay'''' when no panel is open'
      since: null
    - name: componentType
      type: String
      default: null
      desc: '''''EmptyDisplayComponent'''' when no panel is open'
      since: null
  right: !Item
    name: infoPanelId
    desc: info panel classname, or "left" or "right"
    type: String
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.72'
examples:
- <sqf>infoPanel "left" params ["_componentClass", "_componentType"];</sqf>
see_also:
- Arma
- '3:'
- Custom
- Info
- infoPanels
- setInfoPanel
- infoPanelComponents
- enableInfoPanelComponent
- infoPanelComponentEnabled
- openGPS
