name: diag_stacktrace
desc: Returns an array containing the function name, line number, scope name and all local variables in form of a hashmap.
groups:
- Diagnostic
syntax:
- call: Nular
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: |-
      of [[Array]]s, in format:
      * _functionName: [[String]] - function name
      * _lineNumber: [[Number]] - line number
      * _scopeName: [[String]] - scope name
      * _variablesHashmap: [[HashMap]] - all local variables
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '2.06'
examples:
- "<sqf>\nprivate _testvar = 1;\nprivate _testother = 2;\ncall \n{\n\t_testvar = 3;\n\tif (_testvar == 3) then \n\t{\n\t\t_myVariable = 4;\n\t\thint str diag_stacktrace;\n\t};\n};\n/*\n[\n\t[\"\", 3, \"\", [[\"_this\", []], [\"_testother\", 2], [\"_testvar\", 3]]],\n\t[\"\", 6, \"\", []],\n\t[\"\", 8, \"\", [[\"_myvariable\", 4]]]\n]\n*/\n</sqf>"
see_also:
- arma.RPT
- diag_dumpCalltraceToLog
- diag_log
