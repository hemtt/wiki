name: visibleGPS
desc: Checks if the player has GPS receiver (minimap) opened and visible.
groups:
- Interaction
syntax:
- call: Nular
  ret:
    type: Boolean
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.22'
examples:
- "<sqf>\nif (visibleGPS) then\n{\n\thint \"GPS is visible\";\n};\n</sqf>"
see_also:
- openGPS
- showGPS
- shownGPS
- visibleWatch
- visibleCompass
