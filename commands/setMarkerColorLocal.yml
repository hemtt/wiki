name: setMarkerColorLocal
desc: 'Set marker''s colour. {{arma3}}''s marker colour names and their corresponding RGBA values can be found here: [[Arma 3: CfgMarkerColors]].'
groups:
- Markers
syntax:
- call: !Binary
  - markerName
  - colour
  ret:
    type: Nothing
  left: !Item
    name: markerName
    type: String
  right: !Item
    name: colour
    desc: |-
      * {{hl|{{Link|Arma 3: CfgMarkerColors|CfgMarkerColors}}}}'s class name
      * {{GVI|arma3|2.20|size= 0.75}} direct colour definition in one of the following formats (values in range 0..1):
      ** "#(r,g,b)" (e.g {{hl|"#(1,0,1)"}}, {{hl|#FF00FF}} equivalent)
      ** "#(r,g,b,a)" (e.g {{hl|"#(0.678,0.749,0.514,0.5)"}}, {{hl|#ADBF8380}} equivalent). Alpha 'a' in this format is independent of [[markerAlpha]]
    type: String
argument_loc: Global
effect_loc: Local
since:
  arma1: '1.04'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>"MarkerOne" setMarkerColorLocal "ColorBlack";</sqf>
- <sqf>"MarkerOne" setMarkerColorLocal "#(1,0,0,1)"; // red color (since {{arma3}} v2.20)</sqf>
see_also:
- markerColor
- getMarkerColor
- setMarkerAlpha
- setMarkerAlphaLocal
- setMarkerBrush
- setMarkerBrushLocal
- setMarkerColor
