name: moveInAny
desc: |-
  Moves unit to the first available seat in the specified vehicle.

  The order of priorities is the same order used in squad command when you order subordinates to get in vehicle to any position and is the same order used in Zeus when you drag units to a vehicle.<br><br>
  Seat assignment seems to use the following priority logic:<br>
  driver ([[moveInDriver]]) &rarr; commander ([[moveInCommander]]) &rarr; gunner ([[moveInGunner]]) &rarr; turrets ([[moveInTurret]]) &rarr; cargo ([[moveInCargo]]).
  {{Feature|important|If the unit is already in a vehicle, nothing will happen. You should use [[moveOut]] to move the unit out of his vehicle before trying to move him into a new (or same) vehicle.}}
  {{Feature|informative|This command will move player into the [[locked]] vehicle or seat just as well.}}
groups:
- Unit Control
syntax:
- call: !Binary
  - unit
  - vehicle
  ret:
    type: Boolean
    desc: '[[true]] on success, [[false]] on failure'
  left: !Item
    name: unit
    desc: person
    type: Object
  right: !Item
    name: vehicle
    desc: transport
    type: Object
- call: !Binary
  - unit
  - - vehicle
    - positions
    - ignoreLocked
  ret:
    type: Boolean
    desc: '[[true]] on success, [[false]] on failure'
  left: !Item
    name: unit
    desc: person
    type: Object
  right: !Array
  - !Item
    name: vehicle
    desc: transport
    type: Object
  - !Item
    name: positions
    desc: |-
      array of positions to check and in which order. Positions are (in default order):
      * "DRIVER" - driver
      * "COMMANDER" - commander turret (turret configured as commander)
      * "GUNNER" - gunner turret (turret configured as gunner)
      * "TURRET" - other turrets incl. FFV but excl. gunner or commander turret
      * "CARGO" - cargo seats excl. FFV
    type: !ArrayUnsized
      value: String
  - !Item
    name: ignoreLocked
    desc: '[[true]] to ignore locked positions'
    type: Boolean
    optional: true
    default: 'false'
  since:
    arma3: '2.22'
argument_loc: Global
effect_loc: Global
since:
  arma3: '1.18'
examples:
- <sqf>player moveInAny tank;</sqf>
- <sqf>player moveInAny [tank, ["CARGO", "TURRET"]]; // checks free cargo position, if not available, checks free turret next</sqf>
see_also:
- moveInDriver
- moveInCommander
- moveInGunner
- moveInTurret
- moveInCargo
- emptyPositions
