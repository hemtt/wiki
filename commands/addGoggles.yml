name: addGoggles
desc: "Create a new item and try to link it into goggles (glasses) slot.\n{{Feature | informative | This command does '''not''' add NVGs, which are [[hmd]] slot items (see [[linkItem]] instead). The glasses could be one of the following modes:\n\n<sqf>_mode = getNumber(configFile >> \"CfgGlasses\" >> \"G_Diving\" >> \"mode\"); // 1 \n/*\n0 - None\n1 - Diving\n2 - Goggles\n3 - NVG\n4 - DivingAndOverwater (since 2.08)\n*/\n</sqf>\n}}"
groups:
- Unit Inventory
syntax:
- call: !Binary
  - unit
  - type
  ret:
    type: Nothing
  left: !Item
    name: unit
    type: Object
  right: !Item
    name: type
    type: String
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '0.50'
examples:
- <sqf>player addGoggles "G_Tactical_Clear";</sqf>
- <sqf>diver addGoggles "G_Diving";</sqf>
see_also:
- goggles
- removeGoggles
