name: setMimic
desc: |-
  Sets person's facial expression. To set it back to default, use "".
  {{Feature|arma3|Prior to {{arma3}} v2.01.146630 Mimics must be written in all lower case letters.}}
groups:
- Object Manipulation
- Unit Identity
syntax:
- call: !Binary
  - person
  - mimic
  ret:
    type: Nothing
  left: !Item
    name: person
    type: Object
  right: !Item
    name: mimic
    desc: |-
      can be one of:
      * "Default"
      * "Normal"
      * "Smile"
      * "Hurt"
      * "Ironic"
      * "Sad"
      * "Cynic"
      * "Surprised"
      * {{sic|"Agresive"}}
      * "Angry"
      * "neutral"
      * "dead"
      * "danger"
      * "hurt"
      * "aware"
      * "safe"
      * "combat"
      * "unconscious"
    type: String
argument_loc: Global
effect_loc: Local
since:
  ofp: '1.00'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_soldier1 setMimic "hurt";</sqf>
see_also:
- setIdentity
- setFace
- setFaceAnimation
- enableMimics
- setRandomLip
