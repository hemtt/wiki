name: setTriggerStatements
desc: Defines trigger condition, activation and deactivation statements. Trigger condition has to return [[Boolean]]. [[true]] will activate the trigger, [[false]] will deactivate it (only if activation is set to repeat). [[thisList]] returns the same result as [[list]] command, which includes all entities in the trigger area that are capable of activating the trigger. Dead entities are excluded as well as crew in vehicles, vehicles themselves are included.
groups:
- Triggers
syntax:
- call: !Binary
  - trigger
  - - condition
    - activation
    - deactivation
  ret:
    type: Nothing
  left: !Item
    name: trigger
    desc: trigger object
    type: Object
  right: !Array
  - !Item
    name: condition
    desc: |-
      code containing trigger condition. Special variables available here:
      * [[Magic Variables#this_2|this]] ([[Boolean]]) - detection event
      * [[thisTrigger]] ([[Object]]) - trigger instance
      * [[thisList]] ([[Array]]) - array of all detected entities
    type: String
  - !Item
    name: activation
    desc: |-
      code that is executed when the trigger is activated. Special variables available here:
      * [[thisTrigger]] ([[Object]]) - trigger instance
      * [[thisList]] ([[Array]]) - array of all detected entities
      * [[thisActivator]] ([[Object]]) {{GVI|arma3|2.22}} -  what or who activated the trigger, default: [[thisTrigger]]
    type: String
  - !Item
    name: deactivation
    desc: |-
      code that is executed when the trigger is deactivated. Special variable available here:
      * [[thisTrigger]] ([[Object]]) - trigger instance
    type: String
argument_loc: Global
effect_loc: Local
since:
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_trg setTriggerStatements ["this", "hint 'trigger on'", "hint 'trigger off'"];</sqf>
