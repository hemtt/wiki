name: land
desc: Forces a helicopter landing. If there is a helipad nearby, the helicopter will attempt to land on it. VTOL he other hand will just land somewhere. To make helicopter or VTOL land on a specific helipad use [[landAt]].
groups:
- Unit Control
syntax:
- call: !Binary
  - helicopter
  - mode
  ret:
    type: Nothing
  left: !Item
    name: helicopter
    desc: helicopter or VTOL
    type: Object
  right: !Item
    name: mode
    desc: ''
    type: !StringEnum
    - value: LAND
      desc: Complete stop
      since: null
    - value: GET IN
      desc: Hovering very low, for another unit to get in
      since: null
    - value: GET OUT
      desc: Hovering low, for another unit to get out
      since: null
argument_loc: Local
effect_loc: Global
since:
  ofp: '1.00'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_cobraOne land "LAND";</sqf>
see_also:
- landAt
- allAirports
