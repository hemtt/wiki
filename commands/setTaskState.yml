name: setTaskState
desc: Set the state of a given task.
groups:
- Briefing
syntax:
- call: !Binary
  - task
  - state
  ret:
    type: Nothing
  left: !Item
    name: task
    type: Task
  right: !Item
    name: state
    desc: |-
      state value may be one of:
      *"None"
      *"Created"
      *"Assigned"
      *"Succeeded"
      *"Failed"
      *"Canceled"
    type: String
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_tskKillSpongebob setTaskState "Succeeded";</sqf>
see_also:
- Tasks
- createSimpleTask
- removeSimpleTask
- setSimpleTaskDescription
- setSimpleTaskDestination
- setTaskResult
- taskState
