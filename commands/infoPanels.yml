name: infoPanels
desc: Returns array all info panels configured for given object or object and turret path.
groups:
- Custom Panels
syntax:
- call: !Unary unit
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: |-
      format [[infoPanelId1, infoPanelShortcutId1], [infoPanelId2, infoPanelShortcutId2], ...]:
      * infoPanelId: [[String]] - name of the info panel class as defined in vehicle config
      * infopanelShortcutId: [[String]] - shortcut representation of ''infopanelId'', currently are supported only shortcuts "left" and "right"
  right: !Item
    name: unit
    desc: the concerned vehicle
    type: Object
- call: !Unary
  - unit
  - turretPath
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: |-
      format [[infoPanelId1, infoPanelShortcutId1], [infoPanelId2, infoPanelShortcutId2], ...]:
      * infoPanelId: [[String]] - name of the info panel class as defined in vehicle config
      * infopanelShortcutId: [[String]] - shortcut representation of ''infopanelId'', currently are supported only shortcuts "left" and "right"
  right: !Array
  - !Item
    name: unit
    desc: the concerned vehicle
    type: Object
  - !Item
    name: turretPath
    desc: turret index
    type: TurretPath
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.72'
examples:
- <sqf>infoPanels [vehicle player, [0]];</sqf>
see_also:
- Arma
- '3:'
- Custom
- Info
- infoPanel
- setInfoPanel
- infoPanelComponents
- enableInfoPanelComponent
- infoPanelComponentEnabled
- openGPS
