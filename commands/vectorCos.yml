name: vectorCos
desc: Cosine of angle between two 3D or 2D vectors.
groups:
- Math - Vectors
syntax:
- call: !Binary
  - vector1
  - vector2
  ret:
    type: Number
  left: !Item
    name: vector1
    desc: When [[Vector2D]] is provided the z coordinate is defaulted to 0
    type: !Unknown 'Unknown simple type: '
  right: !Item
    name: vector2
    desc: When [[Vector2D]] is provided the z coordinate is defaulted to 0
    type: !Unknown 'Unknown simple type: '
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.22'
examples:
- <sqf>_cos = getPos player vectorCos [0,0,2];</sqf>
see_also:
- vectorAdd
- vectorDiff
- vectorCrossProduct
- vectorDotProduct
- vectorMagnitude
- vectorMagnitudeSqr
- vectorMultiply
- vectorDistance
- vectorDistanceSqr
- vectorDir
- vectorUp
- setVectorDir
- setVectorUp
- setVectorDirAndUp
- vectorNormalized
- vectorFromTo
- matrixMultiply
- matrixTranspose
