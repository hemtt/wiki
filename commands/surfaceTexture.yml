name: surfaceTexture
desc: |-
  Same as [[surfaceType]], but returns texture path to ground texture as string.
  {{Feature|informative|The texture returned is of the ground, even if there is a road at that position. To get road texture use [[getRoadInfo]] command.}}
groups:
- Positions
syntax:
- call: !Unary
  - x
  - y
  - useLayerMask
  ret:
    type: String
    desc: Surface texture
  right: !Array
  - !Item
    name: x
    desc: world x coordinate of the position
    type: Number
  - !Item
    name: y
    desc: world y coordinate of the position
    type: Number
  - !Item
    name: useLayerMask
    desc: When a number is provided (Z in 3D positions), it is ignored. When a boolean is provided, it defines whether the layer mask should be used. Using the layer mask is more accurate but slightly slower.
    type: !OneOf
    - type: Number
      desc: null
      since: null
    - type: Boolean
      desc: null
      since: null
    since:
      arma3: '2.18'
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '2.00'
examples:
- <sqf>private _groundTexture = surfaceTexture getPosATL player;</sqf>
- |-
  <sqf>
  private _pos = getPosATL player;
  _pos set [2, true]; // use layer mask
  private _groundTexture = surfaceTexture _pos;
  </sqf>
see_also:
- surfaceType
- getRoadInfo
