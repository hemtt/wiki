name: setFlagTexture
desc: Sets flag texture.
groups:
- Flags
syntax:
- call: !Binary
  - flag
  - texture
  ret:
    type: Nothing
  left: !Item
    name: flag
    desc: a flag pole
    type: Object
  right: !Item
    name: texture
    desc: |-
      flag texture. If texture is {{hl|""}}, flag is not drawn. Custom texture can be used:
      * Prior {{arma3}}: Dimension 200×200, file extension .jpg
      * Since {{arma3}}: Dimension 512×256, file extension .paa
    type: String
argument_loc: Local
effect_loc: Global
since:
  ofp: '1.00'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_flagE setFlagTexture "\ca\misc\data\sever_vlajka.paa";</sqf>
- <sqf>_flagW setFlagTexture "\ca\misc\data\usa_vlajka.paa";</sqf>
- <sqf>flag1 setFlagTexture "\A3\Data_F\Flags\Flag_red_CO.paa";</sqf>
- <sqf>_customFlag setFlagTexture "myMissionFlag.paa";</sqf>
- <sqf>_flag_Arma_3 setFlagTexture "\a3\ui_f\data\Logos\arma3_expansion_ca.paa";</sqf>
- |-
  Capturable OPFOR flag:
  <sqf>
  private _flag = "FlagPole_F" createVehicle position player;
  _flag setFlagTexture "\A3\Data_F\Flags\Flag_CSAT_CO.paa";
  _flag setFlagSide east;
  </sqf>
see_also:
- flag
- flagOwner
- setFlagOwner
- setFlagSide
- setObjectTexture
- setObjectTextureGlobal
- flagSide
- flagTexture
- setFlagAnimationPhase
- flagAnimationPhase
- forceFlagTexture
- getForcedFlagTexture
