name: objectCurators
desc: Returns array with all curators which can edit given object.
groups:
- Curator
syntax:
- call: !Unary obj
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: of [[Object]]s
  right: !Item
    name: obj
    type: Object
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '1.16'
examples:
- <sqf>_curatorsThatcanEdit = objectCurators BIS_Tank;</sqf>
see_also:
- addCuratorEditableObjects
- curatorRegisteredObjects
- removeCuratorEditableObjects
