name: say2D
desc: Plays given sound in 2D.
groups:
- Sounds
syntax:
- call: !Binary
  - from
  - sound
  ret:
    type: Nothing
  left: !Item
    name: from
    desc: |-
      * [[Object]] - the sound source
      * [[Array]] with [from, to]
      ** from: [[Object]] - sound source
      ** to: [[Object]] - target
    type: !Unknown Exceeded maximum recursion depth while parsing Value
  right: !Item
    name: sound
    desc: |-
      * [[String]] - class name of the sound to be played. Defined in CfgSounds including [[Description.ext]]
      * [[Array]] with [sound, maxTitlesDistance, speed]
      ** sound: [[String]] - class name of the sound to be played. Defined in CfgSounds including [[Description.ext]]
      ** maxTitlesDistance: [[Number]] (Optional, default 100) - max. distance in meters at which the sound can be heard
      ** speed: [[Number]] (Optional, default 1) - pitch of the sound
    type: !Unknown Exceeded maximum recursion depth while parsing Value
argument_loc: Global
effect_loc: Local
since:
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>player say2D "HelloThere";</sqf>
- <sqf>[player, _officer] say2D ["HelloThere", 50, 0.9];</sqf>
see_also:
- say
- say3D
- playSound
- createSoundSource
- playSoundUI
