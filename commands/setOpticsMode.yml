name: setOpticsMode
desc: Sets the optic mode of the current weapon to the given class name or the index.
groups:
- Object Manipulation
syntax:
- call: !Binary
  - unit
  - mode
  ret:
    type: Nothing
  left: !Item
    name: unit
    type: Object
  right: !Item
    name: mode
    desc: |-
      class name defined in the optic's {{hl|OpticsModes}} config class
      0-based index of the optic mode with 0 being the default optic mode
      [[Array]] with [slotIndex, opticsModeIndexOrClassName]
    type: !OneOf
    - type: String
      desc: class name defined in the optic's {{hl|OpticsModes}} config class
      since: null
    - type: Number
      desc: 0-based index of the optic mode with 0 being the default optic mode
      since: null
    - type: !Unknown Exceeded maximum recursion depth while parsing Value
      desc: null
      since: null
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma3: '2.10'
examples:
- <sqf>player setOpticsMode "Hamr2Scope"; // Default optic mode for optic_Hamr</sqf>
- <sqf>player setOpticsMode 0;</sqf>
- <sqf>player setOpticsMode [1, 0]; // reset the optics mode of the player's primary weapon to the default</sqf>
see_also:
- getOpticsMode
