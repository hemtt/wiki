name: preloadObject
desc: Preloads all textures, materials and proxies needed to render given object. Works with objects and classnames - note that classnames require an object instance in the mission.
groups:
- Object Manipulation
syntax:
- call: !Binary
  - distance
  - object
  ret:
    type: Boolean
    desc: '[[true]] when preload is finished'
  left: !Item
    name: distance
    desc: distance at which preload the object
    type: Number
  right: !Item
    name: object
    desc: |-
      or [[String]]
      * [[Object]] - existing object
      * [[String]] - object classname - an object of that type must exist in the mission for it to have effect
    type: Object
argument_loc: Unspecified
effect_loc: Unspecified
since:
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- "<sqf>\n0 spawn \n{\n\twaitUntil { 10 preloadObject \"SoldierW\" };\n\thint \"Preload finished\";\n};\n</sqf>"
- "<sqf>\n0 spawn \n{\n\twaitUntil { 10 preloadObject leader player };\n\thint \"Preload finished\";\n};\n</sqf>"
see_also:
- preloadCamera
- preloadSound
- preloadTitleObj
- preloadTitleRsc
