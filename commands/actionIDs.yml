name: actionIDs
desc: Lists the user actions currently on an entity, so they can be inspected with [[actionParams]], changed with [[setUserActionText]] or removed with [[removeAction]] without keeping track of the IDs [[addAction]] returned.
groups:
- Interaction
syntax:
- call: !Unary entity
  ret:
    type: !ArrayUnsized
      value: Number
    desc: IDs of all user actions added to given entity with [[addAction]] command
  right: !Item
    name: entity
    desc: entity with added user actions
    type: Object
argument_loc: Global
effect_loc: Local
since:
  arma3: '1.64'
examples:
- <sqf>_actions = actionIDs player;</sqf>
see_also:
- actionParams
- addAction
- setUserActionText
- inGameUISetEventHandler
- showHUD
- inputAction
- removeAction
- removeAllActions
- action
