name: actionKeysNames
desc: |-
  Returns a list of button names assigned to the given user action.
  Action names can be found in config class {{hl|ControllerSchemes}} or [[:Category:Key Actions|user action names]].
groups:
- Interaction
syntax:
- call: !Unary userAction
  ret:
    type: String
  right: !Item
    name: userAction
    type: String
- call: !Unary
  - userAction
  - maxKeys
  - inputDevicePriority
  ret:
    type: String
  right: !Array
  - !Item
    name: userAction
    type: String
  - !Item
    name: maxKeys
    desc: maximum number of keys to return
    type: Number
  - !Item
    name: inputDevicePriority
    desc: |-
      result sorted by inputDevicePriority with values:
      * {{hl|"Mouse"}}
      * {{hl|"Keyboard"}}
      * {{hl|"Stick"}}
      * {{hl|"Gamepad"}}
      * {{hl|"Tracker"}}
      * {{hl|"Combo"}} (mouse and keyboard combinations)
      * {{sic|{{hl|"Controler"}}}} (any controller other than mouse or keyboard)
      * {{hl|"Unsorted"}}
    type: String
    since:
      arma3: '1.36'
argument_loc: Unspecified
effect_loc: Unspecified
since:
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_list = actionKeysNames "ReloadMagazine"; // """R"" or ""XBox X"""</sqf>
see_also:
- actionKeys
- actionKeysImages
- actionKeysNamesArray
- actionName
- inputAction
