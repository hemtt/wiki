name: getWeaponCargo
desc: Returns all weapons types and count from the cargo space
groups:
- Vehicle Inventory
- Containers
syntax:
- call: !Unary object
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: 'format [all_types_array, all_counts_array]. Eg: [["a", "b"], [3, 2]]'
  right: !Item
    name: object
    desc: object to check
    type: Object
argument_loc: Global
effect_loc: Unspecified
since:
  arma2oa: '1.54'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_content = getWeaponCargo carName;</sqf>
- <sqf>_content = getWeaponCargo ammoBoxName;</sqf>
see_also:
- weaponCargo
- addWeaponCargo
- addWeaponCargoGlobal
- clearWeaponCargo
- clearWeaponCargoGlobal
