name: endMission
desc: |-
  Finish the mission.
  '''Mission saves are deleted'''. Use [[failMission]] if they should not be.
  {{Feature|arma3|To maintain {{arma3}} visual style, it is recommended to use [[BIS_fnc_endMission]] instead.}}
multiplayer_note: To end mission properly so that everyone goes to debriefing at the same time, this command should be executed on every machine (see {{Link|#Example 2}}).
groups:
- Mission Information
syntax:
- call: !Unary endType
  ret:
    type: Nothing
  right: !Item
    name: endType
    desc: |-
      "CONTINUE" (does nothing)
      "KILLED"
      "LOSER"
      "END1"
      "END2"
      "END3"
      "END4"
      "END5"
      "END6"
    type: !OneOf
    - type: !Unknown Exceeded maximum recursion depth while parsing Value
      desc: null
      since: null
    - type: !Unknown 'Unknown simple type: "killed"'
      desc: null
      since: null
    - type: !Unknown 'Unknown simple type: "loser"'
      desc: null
      since: null
    - type: !Unknown 'Unknown simple type: "end1"'
      desc: null
      since: null
    - type: !Unknown 'Unknown simple type: "end2"'
      desc: null
      since: null
    - type: !Unknown 'Unknown simple type: "end3"'
      desc: null
      since: null
    - type: !Unknown 'Unknown simple type: "end4"'
      desc: null
      since: null
    - type: !Unknown 'Unknown simple type: "end5"'
      desc: null
      since: null
    - type: !Unknown 'Unknown simple type: "end6"'
      desc: null
      since: null
argument_loc: Local
effect_loc: Local
since:
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>endMission "END1";</sqf>
- <sqf>["END1"] remoteExec ["endMission", 0, true]; // Arma 3</sqf>
see_also:
- missionEnd
- failMission
- forceEnd
