name: addMusicEventHandler
desc: |-
  Adds [[playMusic]] event handler. Returns id of the handler or -1 when failed. Like [[addMissionEventHandler]], the music event handler is attached to the mission.
  See {{Link|Arma 3: Event Handlers#Music Event Handlers}}.
groups:
- Event Handlers
- Sounds
syntax:
- call: !Unary
  - type
  - function
  ret:
    type: Number
    desc: event handler id
  right: !Array
  - !Item
    name: type
    desc: '"MusicStart" or "MusicStop"'
    type: String
  - !Item
    name: function
    desc: passed params array is [musicClassname, eventHandlerId] where
    type: !OneOf
    - type: String
      desc: |-
        musicClassName: [[String]] - [[Description.ext#Music|CfgMusic]] class name of the music that started
        eventHandlerId: [[Number]] - event handler id (same as returned by [[addMusicEventHandler]] usage)
        {{GVI|arma3|2.18|size= 0.75}} currentPosition: [[Number]] - current playback position in 0..1 range (see [[getMusicPlayedTime]])
        {{GVI|arma3|2.18|size= 0.75}} totalLength: [[Number]] - track total length in seconds
      since: null
argument_loc: Unspecified
effect_loc: Local
since:
  arma3: '0.50'
examples:
- <sqf>private _ehID = addMusicEventHandler ["MusicStart", { hint str _this }];</sqf>
- <sqf>private _ehID = addMusicEventHandler ["MusicStop", { hint str _this }];</sqf>
see_also:
- removeMusicEventHandler
- playMusic
- '{{Link|Arma'
- '3:'
- Event
- Handlers#Music
- Event
- Handlers}}
- removeAllMusicEventHandlers
- getEventHandlerInfo
