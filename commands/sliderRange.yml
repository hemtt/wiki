name: sliderRange
desc: Returns limits of [[CT_SLIDER]] or [[CT_XSLIDER]].
groups:
- GUI Control
syntax:
- call: !Unary idc
  ret:
    type: !ArraySized
    - name: minValue
      type: Number
      default: null
      desc: null
      since: null
    - name: maxValue
      type: Number
      default: null
      desc: null
      since: null
  right: !Item
    name: idc
    desc: idc of the control
    type: Number
- call: !Unary control
  ret:
    type: !ArraySized
    - name: minValue
      type: Number
      default: null
      desc: null
      since: null
    - name: maxValue
      type: Number
      default: null
      desc: null
      since: null
  right: !Item
    name: control
    type: Control
argument_loc: Unspecified
effect_loc: Unspecified
since:
  ofp: '1.85'
  ofpe: '1.00'
  arma1: '1.00'
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>sliderRange _ctrlSlider params ["_minValue", "_maxValue"];</sqf>
