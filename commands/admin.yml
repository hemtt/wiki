name: admin
desc: |-
  This is dedicated server command, which queries the admin state of any client on the network by their client ([[owner]]) id.
  {{Feature|informative|To self-check the admin state of a local client, use [[BIS_fnc_admin]].}}
groups:
- Multiplayer
syntax:
- call: !Unary ownerID
  ret:
    type: !NumberEnum
    - value: 0
      desc: client is not an admin
      since: null
    - value: 1
      desc: client is admin that is voted in
      since: null
    - value: 2
      desc: client is admin that is logged in
      since: null
    desc: admin state of given client
  right: !Item
    name: ownerID
    desc: '[[clientOwner]] id'
    type: Number
argument_loc: Unspecified
effect_loc: Unspecified
server_exec: true
since:
  arma3: '1.70'
examples:
- <sqf>private _isLoggedInAdmin = admin 3 == 2;</sqf>
- <sqf>private _adminState = admin owner unit1;</sqf>
see_also:
- serverCommand
- serverCommandAvailable
- owner
- clientOwner
- remoteExecutedOwner
