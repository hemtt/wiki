name: lnbDeleteRow
desc: Removes row with the given index from the given listbox or combobox.
groups:
- GUI Control - ListNBox
syntax:
- call: !Binary
  - _ctrl
  - row
  ret:
    type: Nothing
  left: !Item
    name: _ctrl
    type: Control
  right: !Item
    name: row
    type: Number
- call: !Unary
  - idc
  - row
  ret:
    type: Nothing
  right: !Array
  - !Item
    name: idc
    type: Number
  - !Item
    name: row
    type: Number
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma2: '1.00'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_ctrl lnbDeleteRow 1;</sqf>
- <sqf>lnbDeleteRow [105, 0];</sqf>
see_also:
- lnbAddArray
- lnbAddColumn
- lnbAddRow
- lnbClear
- lnbColor
- lnbCurSelRow
- lnbData
- lnbDeleteColumn
- lnbGetColumnsPosition
- lnbPicture
- lnbSetColor
- lnbSetColumnsPos
- lnbSetCurSelRow
- lnbSetData
- lnbSetPicture
- lnbSetText
- lnbSetValue
- lnbSize
- lnbText
- lnbValue
