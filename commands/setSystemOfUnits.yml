name: setSystemOfUnits
desc: |-
  Set system of units. This will only impact gauges from advanced flight model.
  {{Feature|important|This command is buggy: any value other than 0 (metric) will display both units at the same time.}}
groups:
- System
- Broken Commands
syntax:
- call: !Unary value
  ret:
    type: Nothing
  right: !Item
    name: value
    desc: possible values are
    type: !NumberEnum
    - value: 0
      desc: metric
      since: null
    - value: 1
      desc: mixed
      since: null
    - value: 2
      desc: imperial
      since: null
argument_loc: Unspecified
effect_loc: Local
since:
  arma3: '0.50'
examples:
- <sqf>if (player in _myHelicopter) then { setSystemOfUnits 2; };</sqf>
see_also:
- Description.ext#forceRotorLibSimulation|forceRotorLibSimulation
- Advanced
- Helicopter
- Flight
- Model
- in
- Arma3|Advanced
- Helicopter
- Flight
- Model
- :Category:Command_Group:_RTD|RotorLib
- commands
- systemOfUnits
