name: setTargetSize
desc: |-
  Sets target size (see <syntaxhighlight lang="cpp" inline>irTargetSize</syntaxhighlight> and others from vehicle config) override on vehicle.
  {{Feature|informative|Passing an empty array returns the current values without modifying them, so this commands works as both getter and setter.}}
groups:
- Sensors
syntax:
- call: !Binary
  - vehicle
  - - visualTargetSize
    - irTargetSize
    - radarTargetSize
  ret:
    type: !Unknown 'Unknown simple type: array'
    desc: with previous [visualTargetSize, irTargetSize, radarTargetSize] values
  left: !Item
    name: vehicle
    desc: a transport vehicle
    type: Object
  right: !Array
  - !Item
    name: visualTargetSize
    desc: 0..2 value, set to -1 to disable override and use config values
    type: Number
  - !Item
    name: irTargetSize
    type: Number
  - !Item
    name: radarTargetSize
    type: Number
argument_loc: Global
effect_loc: Local
since:
  arma3: '2.22'
examples:
- <sqf>private _previousSizes = vehicle player setTargetSize [0,0,0]; // set</sqf>
- <sqf>private _currentSizes = vehicle player setTargetSize []; // get</sqf>
see_also:
- getSensorTargets
