name: checkAIFeature
desc: Checks if the given AI feature is currently enabled.
groups:
- AI Behaviour
syntax:
- call: !Unary feature
  ret:
    type: Boolean
    desc: '[[true]] if is enabled'
  right: !Item
    name: feature
    desc: ''
    type: !StringEnum
    - value: AwareFormationSoft
      desc: null
      since: null
    - value: CombatFormationSoft
      desc: null
      since: null
- call: !Binary
  - unit
  - feature
  ret:
    type: Boolean
    desc: '[[true]] if is enabled'
  left: !Item
    name: unit
    desc: unit to test AI feature for
    type: Object
  right: !Item
    name: feature
    desc: '[[disableAI]] / [[enableAI]] feature'
    type: String
  since:
    arma3: '1.96'
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma2: '1.05'
  arma2oa: '1.50'
  tkoh: '1.00'
  arma3: '0.50'
examples:
- <sqf>_featureUsed = checkAIFeature "AwareFormationSoft";</sqf>
- <sqf>_autotargetOn = bob checkAIFeature "AUTOTARGET";</sqf>
see_also:
- enableAIFeature
- enableAI
- getUnitState
- disableAI
