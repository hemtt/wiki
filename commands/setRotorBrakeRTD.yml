name: setRotorBrakeRTD
desc: Toggles a helicopter's rotor brake. {{Feature|afm}}
groups:
- RTD
syntax:
- call: !Binary
  - helicopterRTD
  - enable
  ret:
    type: Nothing
  left: !Item
    name: helicopterRTD
    desc: helicopter
    type: Object
  right: !Item
    name: enable
    desc: |-
      can be:
      * 0: off
      * 1: on
    type: Number
argument_loc: Unspecified
effect_loc: Unspecified
since:
  tkoh: '1.00'
  arma3: '1.34'
examples:
- <sqf>myHelicopterRTD setRotorBrakeRTD 1;</sqf>
see_also:
- getRotorBrakeRTD
